<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Touryteller · Global Expansion Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e2e6ec;--text:#171b24;--muted:#6c7789;--blue:#2f6fec;--amber:#e8a020;--green:#15956a;--purple:#8058e8;--coral:#ea795f;--shadow:0 8px 28px rgba(17,24,39,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#39b7ff,#7557ff 62%,#b14cff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.brand b{font-size:18px}.brand small{display:block;color:var(--muted)}.actions{display:flex;gap:8px}.action{min-height:42px;border:1px solid var(--line);background:#fff;color:#263142;border-radius:14px;padding:0 13px;font-weight:800;cursor:pointer}.action.primary{background:#151923;color:#fff;border-color:#151923}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:12px 2px}.head h1{font-size:27px;margin:0 0 4px;line-height:1.05}.head p{margin:0;color:var(--muted);font-size:13px}.sync{font-size:12px;color:var(--green);white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 12px;box-shadow:0 3px 12px rgba(17,24,39,.035)}.stat .n{font-size:24px;font-weight:900}.stat small{display:block;color:var(--muted);margin-top:2px}.stat .sub{font-size:10px;color:#516073;margin-top:5px}.focus{background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow)}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:#7c8796;margin:2px 3px 7px}.pills{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.pill{border:1px solid var(--line);background:#fff;color:#495668;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:800;cursor:pointer}.pill .count{font-size:10px;color:#8a94a4;margin-left:4px}.pill.active{background:#171b24;color:#fff;border-color:#171b24}.pill[data-view="SENT"].active{background:var(--blue);border-color:var(--blue)}.pill[data-view="QUEUE"].active{background:var(--amber);border-color:var(--amber);color:#2c220c}.pill[data-view="INTERESTED"].active{background:var(--green);border-color:var(--green)}.pill[data-view="WON"].active{background:var(--purple);border-color:var(--purple)}.pill[data-view="ROADMAP"].active{background:#344054;border-color:#344054}.secondary{margin-top:9px}.searchRow{display:flex;gap:8px;margin:10px 0 9px}.search{flex:1;min-width:0;border:1px solid var(--line);background:#fafbfc;border-radius:15px;padding:12px 14px;outline:none}.search:focus{background:#fff;border-color:#b7c1d0}.smallbtn{width:46px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:900;color:#485568;cursor:pointer}.mapShell{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#e9edf1}#map{height:510px;background:linear-gradient(180deg,#edf1f4,#e8edf1)}.overlay{position:absolute;z-index:700;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:rgba(255,255,255,.95);border:1px solid #dfe4ea;border-radius:12px;padding:7px 9px;color:#435066;font-size:11px;font-weight:850;box-shadow:0 3px 12px rgba(17,24,39,.05);backdrop-filter:blur(8px)}.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px rgba(17,24,39,.1)!important}.leaflet-control-zoom a{background:#fff!important;color:#344054!important;border-color:#e3e7ed!important}.leaflet-tooltip{background:#fff!important;color:#111827!important;border:1px solid #e5e7eb!important;border-radius:10px!important;box-shadow:0 8px 20px rgba(17,24,39,.1)!important;font-size:11px!important}.leaflet-tooltip:before{display:none}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:9px 3px 1px;color:#667085;font-size:11px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.detail{margin-top:10px;background:#fbfcfd;border:1px solid var(--line);border-radius:17px;padding:12px;display:grid;grid-template-columns:1.15fr 1fr;gap:12px}.detail h2{margin:1px 0 3px;font-size:22px}.detail p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.mini,.break{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}.mini b{font-size:16px}.mini span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.break{font-size:11px;color:#5c6778}.break b{float:right;color:#111827;font-size:14px}.unmapped{margin-top:9px;padding:10px 11px;border:1px dashed #cbd3dd;background:#fafbfc;border-radius:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}.unmapped p{margin:3px 0 0;color:var(--muted);font-size:11px}.unmapped .big{font-size:26px;font-weight:900;color:#4b5565}.road{display:none;margin-top:9px;padding:11px;border:1px solid var(--line);border-radius:15px;background:#fff}.road h3{margin:0 0 3px}.road p{margin:0;color:var(--muted);font-size:12px}.roadList{display:flex;gap:7px;overflow:auto;margin-top:9px}.roadCard{min-width:145px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fafbfc;cursor:pointer}.roadCard b,.roadCard small{display:block}.roadCard small{color:var(--muted);margin-top:2px}.score{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:999px;background:#e7f7f1;color:#087653;font-size:10px;font-weight:850}.focus:fullscreen{background:#f6f7f9;padding:12px;overflow:auto}.focus:fullscreen #map{height:calc(100vh - 280px);min-height:420px}
@media(max-width:760px){.app{padding:8px}.brand small{display:none}.head h1{font-size:22px}.sync{font-size:11px}.stats{grid-template-columns:repeat(2,1fr)}.stat .n{font-size:21px}.action span{display:none}#map{height:420px}.detail{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.breakdown{grid-template-columns:repeat(3,1fr)}.focus:fullscreen #map{height:62vh;min-height:340px}}
@media(max-width:430px){.head{align-items:flex-start}.sync{max-width:120px;white-space:normal;text-align:right}.stats{gap:6px}.stat{padding:9px}.focus{padding:8px;border-radius:18px}#map{height:370px}.breakdown{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">T</div><div><b>Touryteller</b><small>Global Expansion Intelligence</small></div></div>
    <div class="actions"><button class="action" id="worldBtn">⌖ <span>Mundo</span></button><button class="action primary" id="fullBtn">⛶ <span>Pantalla completa</span></button></div>
  </div>
  <div class="head"><div><h1>Mapa comercial mundial</h1><p>CRM real · outreach · estrategia por trimestres</p></div><div class="sync" id="sync">● Cargando…</div></div>
  <div class="stats" id="stats"></div>
  <section class="focus" id="focus">
    <div class="label">Qué quieres ver</div>
    <div class="pills" id="views"></div>
    <div class="secondary" id="funnelBox"><div class="label">Tipo de oportunidad</div><div class="pills" id="funnels"></div></div>
    <div class="secondary" id="quarterBox" style="display:none"><div class="label">Trimestre estratégico</div><div class="pills" id="quarters"></div></div>
    <div class="searchRow"><input id="search" class="search" placeholder="Buscar ciudad o país…"><button class="smallbtn" id="clearBtn">×</button></div>
    <div class="mapShell"><div class="overlay"><div class="badge" id="mode">Todo CRM</div><div class="badge" id="count">—</div></div><div id="map"></div></div>
    <div class="legend" id="legend"></div>
    <div class="detail" id="detail"></div>
    <div class="unmapped" id="unmapped"></div>
    <div class="road" id="road"><h3 id="roadTitle"></h3><p id="roadText"></p><div class="roadList" id="roadList"></div></div>
  </section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_URL='https://raw.githack.com/TourytellerAdmin/touryteller-sales-map/e5c0523b0a950468d123d70dfde86eadf473f2b3/crm-map-data.json';
const GEO_URL='https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';
const COLORS={ALL:'#64748b',SENT:'#2f6fec',QUEUE:'#e8a020',INTERESTED:'#15956a',WON:'#8058e8',Q4:'#2563eb',Q1:'#0f9f8f',Q2:'#e8a020',Q3:'#ea795f'};
const ALIAS={'Spain':'España','Italy':'Italia','Hungary':'Hungría','United Kingdom':'Reino Unido','France':'Francia','Ireland':'Irlanda','Japan':'Japón','Germany':'Alemania','Türkiye':'Turquía','Turkey':'Turquía','Croatia':'Croacia','Czechia':'Chequia','Czech Republic':'Chequia','Poland':'Polonia','Portugal':'Portugal','Netherlands':'Países Bajos','Costa Rica':'Costa Rica','Colombia':'Colombia','Austria':'Austria','United States of America':'Estados Unidos','United States':'Estados Unidos','Mexico':'México','South Korea':'Corea del Sur','Republic of Korea':'Corea del Sur','Thailand':'Tailandia','Argentina':'Argentina','Chile':'Chile','Vietnam':'Vietnam','Singapore':'Singapur','United Arab Emirates':'Emiratos Árabes Unidos','Morocco':'Marruecos','China':'China','Australia':'Australia','South Africa':'Sudáfrica','Peru':'Perú','Canada':'Canadá','Brazil':'Brasil'};
let D,geo,countryLayer,markers=[],view='ALL',funnel='ALL',quarter='ALL';
const map=L.map('map',{minZoom:1.5,maxZoom:8,zoomSnap:.5,zoomControl:true,attributionControl:false}).setView([22,10],2);
const grid=[];for(let lat=-60;lat<=60;lat+=30)grid.push(L.polyline([[lat,-180],[lat,180]],{color:'#d5dce4',weight:.45,opacity:.55,interactive:false}));for(let lng=-150;lng<=150;lng+=30)grid.push(L.polyline([[-85,lng],[85,lng]],{color:'#d5dce4',weight:.45,opacity:.55,interactive:false}));L.layerGroup(grid).addTo(map);
function metric(r){if(view==='ALL'){return funnel==='SUPPLY'?r.supply:funnel==='PARTNER'?r.partners:funnel==='INSTITUTION'?r.institutions:funnel==='CAPITAL'?r.capital:funnel==='CONTEST'?r.contests:r.total}if(view==='SENT')return r.sent;if(view==='QUEUE')return r.queue;if(view==='INTERESTED')return r.interested;if(view==='WON')return r.won;return 0}
function label(){return({ALL:'oportunidades CRM',SENT:'outreach activo',QUEUE:'preparados / cola',INTERESTED:'interesados',WON:'conseguido real',ROADMAP:'roadmap'})[view]}
function color(){return COLORS[view]||COLORS.ALL}
function rows(){return view==='ROADMAP'?[]:D.locations.filter(r=>metric(r)>0)}
function countryValues(){const out={};if(view==='ROADMAP'){D.roadmap.filter(r=>quarter==='ALL'||r.quarter===quarter).forEach(r=>out[r.country]=(out[r.country]||0)+1);return out}rows().forEach(r=>out[r.country]=(out[r.country]||0)+metric(r));return out}
function countryStyle(name){const vals=countryValues(),v=vals[name]||0;if(!v)return{color:'#d5dbe2',weight:.6,opacity:.7,fillColor:'#f5f7f9',fillOpacity:.78};if(view==='ROADMAP'){const q=D.roadmap.find(r=>r.country===name&&(quarter==='ALL'||r.quarter===quarter))?.quarter||'Q4';return{color:COLORS[q],weight:1.4,opacity:.8,fillColor:COLORS[q],fillOpacity:.13}}const max=Math.max(...Object.values(vals),1);return{color:color(),weight:1.2,opacity:.78,fillColor:color(),fillOpacity:.10+Math.min(.26,(v/max)*.26)}}
function redrawCountries(){if(countryLayer)map.removeLayer(countryLayer);countryLayer=L.geoJSON(geo,{style:f=>{const raw=f.properties.name||f.properties.ADMIN||'';return countryStyle(ALIAS[raw]||raw)},onEachFeature:(f,l)=>{const raw=f.properties.name||f.properties.ADMIN||'';const name=ALIAS[raw]||raw;l.on('click',()=>selectCountry(name));l.bindTooltip(()=>countryTip(name),{sticky:true})}}).addTo(map);if(countryLayer.bringToBack)countryLayer.bringToBack()}
function countryTip(name){if(view==='ROADMAP'){const rr=D.roadmap.filter(r=>r.country===name&&(quarter==='ALL'||r.quarter===quarter));return `<b>${name}</b><br>${rr.length} objetivos`}const v=D.locations.filter(r=>r.country===name).reduce((a,r)=>a+metric(r),0);return `<b>${name}</b><br>${v} · ${label()}`}
function redrawMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];if(view==='ROADMAP'){D.roadmap.filter(r=>quarter==='ALL'||r.quarter===quarter).forEach(r=>{const m=L.circleMarker([r.lat,r.lng],{radius:r.score>=94?8:6,color:'#fff',weight:2.2,fillColor:COLORS[r.quarter],fillOpacity:.96}).addTo(map);m.bindTooltip(`<b>${r.name}</b> · ${r.country}<br>${r.quarter} · Match ${r.score}`);m.on('click',()=>showRoad(r));markers.push(m)});return}rows().forEach(r=>{const v=metric(r),m=L.circleMarker([r.lat,r.lng],{radius:Math.max(5,Math.min(15,5+Math.sqrt(v)*2.15)),color:'#fff',weight:2.2,fillColor:color(),fillOpacity:.96}).addTo(map);m.bindTooltip(`<b>${r.name}</b> · ${r.country}<br>${v} · ${label()}`);m.on('click',()=>showLocation(r));markers.push(m)})}
function redraw(){redrawCountries();redrawMarkers();document.getElementById('mode').textContent=view==='ROADMAP'?(quarter==='ALL'?'Roadmap 12 meses':quarter):label();const n=view==='ROADMAP'?D.roadmap.filter(r=>quarter==='ALL'||r.quarter===quarter).length:rows().reduce((a,r)=>a+metric(r),0);document.getElementById('count').textContent=n+' en mapa';document.getElementById('legend').innerHTML=view==='ROADMAP'?`<span><i style="background:${COLORS.Q4}"></i>Q4 2026</span><span><i style="background:${COLORS.Q1}"></i>Q1 2027</span><span><i style="background:${COLORS.Q2}"></i>Q2 2027</span><span><i style="background:${COLORS.Q3}"></i>Q3 2027</span>`:`<span><i style="background:${color()}"></i>${label()}</span><span>● tamaño = volumen</span><span>fondo país = intensidad</span>`}
function renderStats(){const s=D.summary;document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${s.total}</div><small>Oportunidades CRM</small><div class="sub">Todas contabilizadas</div></div><div class="stat"><div class="n">${s.mapped}</div><small>Con ubicación</small><div class="sub">${s.unmapped} aún sin ciudad</div></div><div class="stat"><div class="n">${s.outreachActive}</div><small>Outreach activo</small><div class="sub">${s.outreachMapped} visibles en mapa</div></div><div class="stat"><div class="n">${s.won}</div><small>Conseguido real</small><div class="sub">Barcelona · Tokio · Medellín</div></div>`}
function renderControls(){const s=D.summary,vs=[['ALL','Todo CRM',s.total],['SENT','📤 Enviados',s.outreachActive],['QUEUE','⏳ Preparados / cola',s.queue],['INTERESTED','★ Interesados',s.interested],['WON','✓ Conseguido',s.won],['ROADMAP','🧭 Roadmap 12M','']];document.getElementById('views').innerHTML=vs.map(x=>`<button class="pill ${view===x[0]?'active':''}" data-view="${x[0]}">${x[1]}${x[2]!==''?` <span class="count">${x[2]}</span>`:''}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));const fs=[['ALL','Todos',s.total],['SUPPLY','Supply',s.supply],['PARTNER','Partners',s.partners],['INSTITUTION','Instituciones',s.institutions],['CAPITAL','Capital',s.capital],['CONTEST','Concursos',s.contests]];document.getElementById('funnels').innerHTML=fs.map(x=>`<button class="pill ${funnel===x[0]?'active':''}" data-funnel="${x[0]}">${x[1]} <span class="count">${x[2]}</span></button>`).join('');document.querySelectorAll('[data-funnel]').forEach(b=>b.onclick=()=>{funnel=b.dataset.funnel;renderControls();redraw();overview()});const qs=[['ALL','12 meses'],['Q4','Q4 2026'],['Q1','Q1 2027'],['Q2','Q2 2027'],['Q3','Q3 2027']];document.getElementById('quarters').innerHTML=qs.map(x=>`<button class="pill ${quarter===x[0]?'active':''}" data-quarter="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-quarter]').forEach(b=>b.onclick=()=>{quarter=b.dataset.quarter;renderControls();redraw();renderRoad();fitCurrent()})}
function setView(v){view=v;if(v!=='ALL')funnel='ALL';document.getElementById('funnelBox').style.display=v==='ALL'?'block':'none';document.getElementById('quarterBox').style.display=v==='ROADMAP'?'block':'none';document.getElementById('road').style.display=v==='ROADMAP'?'block':'none';renderControls();redraw();fitCurrent();if(v==='WON'){const w=D.locations.filter(r=>r.won);if(w[0])showLocation(w[0])}else if(v==='ROADMAP'){renderRoad()}else overview()}
function overview(){document.getElementById('detail').innerHTML=`<div><div class="label">Lectura rápida</div><h2>${view==='SENT'?'Dónde estamos disparando ahora':view==='QUEUE'?'Preparado pero no enviado':view==='INTERESTED'?'Interés comercial real':view==='WON'?'Mercados realmente conseguidos':'Todo el CRM geolocalizable'}</h2><p>${view==='SENT'?'Supply en ENVIADO + instituciones CONTACTADA. No mezcla cola ni borradores.':view==='QUEUE'?'COLA_ENVIO / preparado. No equivale a autorización técnica de TYR.':view==='INTERESTED'?'Solo INTERESADO verificado.':view==='WON'?'Solo ACTIVO o CREANDO_EXPERIENCIA: Barcelona, Tokio y Medellín.':'Los registros sin ciudad exacta se contabilizan aparte y no se inventa ubicación.'}</p><div class="metrics"><div class="mini"><b>${D.summary.mapped}</b><span>ubicados</span></div><div class="mini"><b>${D.summary.unmapped}</b><span>sin ciudad</span></div><div class="mini"><b>${D.summary.outreachMapped}</b><span>envíos visibles</span></div><div class="mini"><b>${D.summary.interestedMapped}</b><span>interés visible</span></div><div class="mini"><b>${D.summary.won}</b><span>conseguido</span></div></div></div><div class="breakdown"><div class="break">Supply <b>${D.summary.supply}</b></div><div class="break">Partners <b>${D.summary.partners}</b></div><div class="break">Instituciones <b>${D.summary.institutions}</b></div><div class="break">Concursos <b>${D.summary.contests}</b></div><div class="break">Capital <b>${D.summary.capital}</b></div><div class="break">CRM <b>${D.summary.total}</b></div></div>`}
function showLocation(r){document.getElementById('detail').innerHTML=`<div><div class="label">Mercado CRM</div><h2>${r.name}</h2><p>${r.country}${r.won?` · <b style="color:${COLORS.WON}">${r.wonStage==='ACTIVO'?'Activo':'En creación'}</b>`:''}</p><div class="metrics"><div class="mini"><b>${r.total}</b><span>CRM</span></div><div class="mini"><b>${r.sent}</b><span>enviados</span></div><div class="mini"><b>${r.queue}</b><span>preparados</span></div><div class="mini"><b>${r.interested}</b><span>interesados</span></div><div class="mini"><b>${r.won}</b><span>conseguido</span></div></div></div><div class="breakdown"><div class="break">Supply <b>${r.supply}</b></div><div class="break">Partners <b>${r.partners}</b></div><div class="break">Instituciones <b>${r.institutions}</b></div><div class="break">Capital <b>${r.capital}</b></div><div class="break">Concursos <b>${r.contests}</b></div><div class="break">Visible <b>${metric(r)}</b></div></div>`;map.flyTo([r.lat,r.lng],Math.max(map.getZoom(),4),{duration:.4})}
function selectCountry(name){if(view==='ROADMAP'){const rr=D.roadmap.filter(r=>r.country===name&&(quarter==='ALL'||r.quarter===quarter));if(rr.length){showRoad(rr.sort((a,b)=>b.score-a.score)[0]);map.fitBounds(L.latLngBounds(rr.map(r=>[r.lat,r.lng])).pad(.5),{maxZoom:5})}return}const rr=D.locations.filter(r=>r.country===name&&metric(r)>0);if(!rr.length)return;const sum=k=>rr.reduce((a,r)=>a+(r[k]||0),0);document.getElementById('detail').innerHTML=`<div><div class="label">País</div><h2>${name}</h2><p>${rr.length} mercados visibles en esta vista.</p><div class="metrics"><div class="mini"><b>${sum('total')}</b><span>CRM</span></div><div class="mini"><b>${sum('sent')}</b><span>enviados</span></div><div class="mini"><b>${sum('queue')}</b><span>preparados</span></div><div class="mini"><b>${sum('interested')}</b><span>interesados</span></div><div class="mini"><b>${sum('won')}</b><span>conseguido</span></div></div></div><div class="breakdown">${rr.sort((a,b)=>metric(b)-metric(a)).slice(0,8).map(r=>`<div class="break">${r.name}<b>${metric(r)}</b></div>`).join('')}</div>`;map.fitBounds(L.latLngBounds(rr.map(r=>[r.lat,r.lng])).pad(.35),{maxZoom:5})}
function renderRoad(){const copy={ALL:['12 meses · estrategia mundial','Q4 densifica la tracción actual; Q1 abre beachheads globales; Q2 escala regiones; Q3 densifica mercados ganadores.'],Q4:['Q4 2026 · densidad','Convertir tracción actual antes de dispersarnos.'],Q1:['Q1 2027 · beachheads','América + Asia de alto potencial.'],Q2:['Q2 2027 · escala regional','Asia, MENA, África y Oceanía mediante supply y partners.'],Q3:['Q3 2027 · efecto red','Segundas ciudades solo donde exista evidencia de conversión.']};const [t,p]=copy[quarter];document.getElementById('roadTitle').textContent=t;document.getElementById('roadText').textContent=p;const rr=D.roadmap.filter(r=>quarter==='ALL'||r.quarter===quarter).sort((a,b)=>b.score-a.score);document.getElementById('roadList').innerHTML=rr.slice(0,16).map(r=>`<div class="roadCard" data-city="${r.name}"><b>${r.name}</b><small>${r.country} · ${r.quarter}</small><span class="score">Match ${r.score}</span></div>`).join('');document.querySelectorAll('[data-city]').forEach(el=>el.onclick=()=>showRoad(D.roadmap.find(r=>r.name===el.dataset.city)))}
function showRoad(r){document.getElementById('detail').innerHTML=`<div><div class="label">Objetivo estratégico · ${r.quarter}</div><h2>${r.name}</h2><p>${r.country}. Match Score ${r.score}/100. Estrategia futura, no estado comercial.</p><div class="metrics"><div class="mini"><b>${r.score}</b><span>Match /100</span></div><div class="mini"><b>${r.quarter}</b><span>trimestre</span></div></div></div><div class="breakdown"><div class="break">CRM actual <b>${D.locations.find(x=>x.name===r.name)?.total||0}</b></div><div class="break">Enviados <b>${D.locations.find(x=>x.name===r.name)?.sent||0}</b></div></div>`;map.flyTo([r.lat,r.lng],Math.max(map.getZoom(),4),{duration:.4})}
function renderUnmapped(){document.getElementById('unmapped').innerHTML=`<div><b>CRM sin ciudad exacta</b><p>Se contabiliza, pero no se coloca artificialmente en el mapa.</p></div><div class="big">${D.summary.unmapped}</div>`}
function fitWorld(){map.setView([22,10],2,{animate:true})}function fitCurrent(){const pts=view==='ROADMAP'?D.roadmap.filter(r=>quarter==='ALL'||r.quarter===quarter).map(r=>[r.lat,r.lng]):rows().map(r=>[r.lat,r.lng]);if(!pts.length)return fitWorld();map.fitBounds(L.latLngBounds(pts).pad(.16),{maxZoom:4})}
function search(q){const s=q.trim().toLocaleLowerCase();if(s.length<2)return;let r=D.locations.find(x=>x.name.toLocaleLowerCase().includes(s)||x.country.toLocaleLowerCase().includes(s));if(r){showLocation(r);return}r=D.roadmap.find(x=>x.name.toLocaleLowerCase().includes(s)||x.country.toLocaleLowerCase().includes(s));if(r){setView('ROADMAP');showRoad(r)}}
async function fullscreen(){const el=document.getElementById('focus');if(document.fullscreenElement){await document.exitFullscreen();return}try{if(el.requestFullscreen){await el.requestFullscreen();setTimeout(()=>map.invalidateSize(),180);return}}catch(e){}window.open(location.href,'_blank','noopener')}
document.getElementById('worldBtn').onclick=fitWorld;document.getElementById('fullBtn').onclick=fullscreen;document.getElementById('search').addEventListener('input',e=>search(e.target.value));document.getElementById('clearBtn').onclick=()=>{document.getElementById('search').value='';fitCurrent()};document.addEventListener('fullscreenchange',()=>setTimeout(()=>map.invalidateSize(),180));
Promise.all([fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error('CRM '+r.status);return r.json()}),fetch(GEO_URL).then(r=>{if(!r.ok)throw new Error('Geo '+r.status);return r.json()})]).then(([data,g])=>{D=data;geo=g;renderStats();renderControls();renderUnmapped();overview();redraw();fitWorld();document.getElementById('sync').textContent='● CRM · '+D.snapshotAt}).catch(err=>{console.error(err);const el=document.getElementById('sync');el.style.color='#b42318';el.textContent='Error: '+err.message;document.getElementById('detail').innerHTML=`<div><h2>Error cargando el mapa</h2><p>${err.message}. Recarga para reintentar.</p></div>`});
</script>
</body>
</html>
