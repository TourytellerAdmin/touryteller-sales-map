<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Touryteller · Global Expansion Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e3e7ed;--text:#151922;--muted:#697386;--map:#edf1f4;--blue:#2f6fec;--blueSoft:#eaf1ff;--amber:#e79a19;--amberSoft:#fff5df;--green:#169b67;--greenSoft:#e8f7f1;--purple:#8359e8;--purpleSoft:#f1edff;--coral:#e87359;--gray:#9ba6b5;--shadow:0 8px 28px rgba(17,24,39,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#3db7ff,#7c4dff 60%,#b24cff);display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}.brand b{font-size:18px}.brand small{display:block;color:var(--muted)}.actions{display:flex;gap:8px}.action{border:1px solid var(--line);background:#fff;color:#273142;border-radius:14px;min-height:42px;padding:0 13px;font-weight:700;cursor:pointer}.action.primary{background:#151922;color:#fff;border-color:#151922}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 2px}.head h1{font-size:28px;line-height:1.05;margin:0 0 5px}.head p{margin:0;color:var(--muted)}.sync{font-size:12px;color:var(--green);text-align:right;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 12px;box-shadow:0 3px 14px rgba(17,24,39,.035)}.stat .n{font-size:24px;font-weight:850}.stat small{display:block;color:var(--muted);margin-top:2px}.stat .sub{font-size:11px;margin-top:6px;color:#516073}.mapFocus{background:#fff;border:1px solid var(--line);border-radius:22px;padding:11px;box-shadow:var(--shadow)}.controlLabel{font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#7b8492;margin:2px 3px 7px}.views,.funnels,.quarters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding-bottom:2px}.pill{border:1px solid var(--line);background:#fff;color:#485568;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:750;cursor:pointer;min-height:40px}.pill .count{font-size:10px;color:#7a8594;margin-left:4px}.pill.active{background:#151922;color:#fff;border-color:#151922}.pill.active .count{color:#d8dee8}.pill[data-view="SENT"].active{background:var(--blue);border-color:var(--blue)}.pill[data-view="QUEUE"].active{background:var(--amber);border-color:var(--amber);color:#2f2107}.pill[data-view="INTERESTED"].active{background:var(--green);border-color:var(--green)}.pill[data-view="WON"].active{background:var(--purple);border-color:var(--purple)}.pill[data-view="ROADMAP"].active{background:#273142;border-color:#273142}.subcontrols{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}.funnelWrap,.quarterWrap{min-width:0;flex:1}.quarterWrap{display:none}.searchRow{display:flex;gap:8px;margin:11px 0 9px}.search{flex:1;border:1px solid var(--line);background:#f9fafb;border-radius:15px;padding:12px 14px;outline:none;color:var(--text);min-width:0}.search:focus{border-color:#b4bfd0;background:#fff}.smallbtn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:14px;min-width:46px;cursor:pointer;font-weight:800}.mapShell{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--map)}#map{height:500px;background:linear-gradient(180deg,#eef2f5,#e8edf1)}.mapOverlay{position:absolute;z-index:700;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.mapBadge{background:rgba(255,255,255,.94);border:1px solid rgba(221,226,233,.96);border-radius:12px;padding:7px 9px;color:#445064;font-size:11px;font-weight:800;box-shadow:0 3px 12px rgba(17,24,39,.05);backdrop-filter:blur(10px)}.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px rgba(17,24,39,.1)!important}.leaflet-control-zoom a{background:#fff!important;color:#344054!important;border-color:#e3e7ed!important}.leaflet-control-attribution{display:none}.leaflet-tooltip{background:#fff!important;color:#111827!important;border:1px solid #e5e7eb!important;border-radius:11px!important;box-shadow:0 8px 22px rgba(17,24,39,.11)!important;font-size:11px!important}.leaflet-tooltip:before{display:none}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:9px 3px 1px;color:#667085;font-size:11px}.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.detail{margin-top:10px;border:1px solid var(--line);border-radius:17px;background:#fbfcfd;padding:12px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.detail h2{margin:1px 0 3px;font-size:22px}.detail p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.metricGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}.mini b{font-size:16px}.mini span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}.break{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;font-size:11px;color:#5c6778}.break b{float:right;color:#111827;font-size:14px}.unmapped{margin-top:10px;border:1px dashed #cfd6df;background:#fafbfc;border-radius:16px;padding:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}.unmapped b{font-size:14px}.unmapped p{margin:3px 0 0;color:var(--muted);font-size:11px}.unmapped .big{font-size:26px;font-weight:850;color:#4b5565}.roadmapPanel{display:none;margin-top:10px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:12px}.roadmapPanel h3{margin:0 0 4px}.roadmapPanel p{margin:0;color:var(--muted);font-size:12px}.roadCities{display:flex;gap:7px;overflow:auto;margin-top:10px}.roadCity{min-width:150px;border:1px solid var(--line);border-radius:13px;padding:9px;background:#fafbfc}.roadCity b{display:block;font-size:12px}.roadCity small{display:block;color:var(--muted);margin-top:3px}.score{display:inline-block;margin-top:6px;background:#e8f7f1;color:#087a50;border-radius:999px;padding:3px 6px;font-size:10px;font-weight:850}
.mapFocus:fullscreen{background:#f7f8fa;padding:12px;overflow:auto}.mapFocus:fullscreen #map{height:calc(100vh - 320px);min-height:420px}.mapFocus:fullscreen .mapShell{max-height:none}.mapFocus:fullscreen .detail{background:#fff}
@media(max-width:760px){.app{padding:9px}.brand small{display:none}.head h1{font-size:23px}.sync{display:none}.stats{grid-template-columns:repeat(2,1fr)}.stat .n{font-size:21px}.subcontrols{display:block}.quarterWrap{margin-top:9px}.views,.funnels,.quarters{padding-bottom:4px}.pill{padding:8px 11px}#map{height:415px}.detail{grid-template-columns:1fr}.metricGrid{grid-template-columns:repeat(3,1fr)}.breakdown{grid-template-columns:repeat(3,1fr)}.action span{display:none}.mapFocus:fullscreen #map{height:62vh;min-height:340px}}
@media(max-width:430px){.head h1{font-size:21px}.actions .action{padding:0 10px}.stat{padding:9px}.mapFocus{padding:8px;border-radius:18px}#map{height:365px}.metricGrid{grid-template-columns:repeat(3,1fr)}.breakdown{grid-template-columns:repeat(2,1fr)}.unmapped{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><div class="logo">T</div><div><b>Touryteller</b><small>Global Expansion Intelligence</small></div></div>
    <div class="actions"><button class="action" id="worldBtn">⌖ <span>Ver mundo</span></button><button class="action primary" id="fullBtn">⛶ <span>Pantalla completa</span></button></div>
  </div>
  <div class="head"><div><h1>Mapa comercial mundial</h1><p>CRM real + outreach activo + estrategia por trimestres</p></div><div class="sync" id="sync">● Cargando CRM…</div></div>
  <div class="stats" id="stats"></div>

  <section class="mapFocus" id="mapFocus">
    <div class="controlLabel">Qué quieres ver</div>
    <div class="views" id="views"></div>
    <div class="subcontrols">
      <div class="funnelWrap" id="funnelWrap"><div class="controlLabel">Tipo de oportunidad · solo en “Todo CRM”</div><div class="funnels" id="funnels"></div></div>
      <div class="quarterWrap" id="quarterWrap"><div class="controlLabel">Trimestre estratégico</div><div class="quarters" id="quarters"></div></div>
    </div>
    <div class="searchRow"><input class="search" id="search" placeholder="Buscar ciudad o país…"><button class="smallbtn" id="clearBtn" title="Limpiar búsqueda">×</button></div>
    <div class="mapShell">
      <div class="mapOverlay"><div class="mapBadge" id="mapMode">Todo CRM</div><div class="mapBadge" id="mapCount">107 ubicadas</div></div>
      <div id="map"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="detail" id="detail"></div>
    <div class="unmapped" id="unmapped"></div>
    <div class="roadmapPanel" id="roadmapPanel"><h3 id="roadTitle">Roadmap 12 meses</h3><p id="roadText"></p><div class="roadCities" id="roadCities"></div></div>
  </section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_URL='https://raw.githubusercontent.com/TourytellerAdmin/touryteller-sales-map/main/crm-map-data.json';
const GEO_URL='https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson';
const COLORS={ALL:'#64748b',SENT:'#2f6fec',QUEUE:'#e79a19',INTERESTED:'#169b67',WON:'#8359e8',Q4:'#2563eb',Q1:'#0f9f8f',Q2:'#e79a19',Q3:'#e87359'};
const COUNTRY_ALIASES={'Spain':'España','Italy':'Italia','Hungary':'Hungría','United Kingdom':'Reino Unido','France':'Francia','Ireland':'Irlanda','Japan':'Japón','Germany':'Alemania','Türkiye':'Turquía','Turkey':'Turquía','Croatia':'Croacia','Czechia':'Chequia','Czech Republic':'Chequia','Poland':'Polonia','Portugal':'Portugal','Netherlands':'Países Bajos','Costa Rica':'Costa Rica','Colombia':'Colombia','Austria':'Austria','United States of America':'Estados Unidos','United States':'Estados Unidos','Mexico':'México','South Korea':'Corea del Sur','Republic of Korea':'Corea del Sur','Thailand':'Tailandia','Argentina':'Argentina','Chile':'Chile','Vietnam':'Vietnam','Singapore':'Singapur','United Arab Emirates':'Emiratos Árabes Unidos','Morocco':'Marruecos','China':'China','Australia':'Australia','South Africa':'Sudáfrica','Peru':'Perú','Canada':'Canadá','Brazil':'Brasil'};
let D=null,geo=null,countryLayer=null,markers=[],gridLayer=null,selectedView='ALL',selectedFunnel='ALL',selectedQuarter='ALL',selectedLocation=null;
const map=L.map('map',{minZoom:1.5,maxZoom:8,zoomSnap:.5,zoomControl:true,worldCopyJump:false,attributionControl:false}).setView([22,10],2);
function addGrid(){const lines=[];for(let lat=-60;lat<=60;lat+=30)lines.push(L.polyline([[lat,-180],[lat,180]],{color:'#d8dee5',weight:.45,opacity:.6,interactive:false}));for(let lng=-150;lng<=150;lng+=30)lines.push(L.polyline([[-85,lng],[85,lng]],{color:'#d8dee5',weight:.45,opacity:.6,interactive:false}));gridLayer=L.layerGroup(lines).addTo(map)}addGrid();
function viewMetric(r){if(selectedView==='ALL'){if(selectedFunnel==='SUPPLY')return r.supply;if(selectedFunnel==='PARTNER')return r.partners;if(selectedFunnel==='INSTITUTION')return r.institutions;if(selectedFunnel==='CAPITAL')return r.capital;if(selectedFunnel==='CONTEST')return r.contests;return r.total}if(selectedView==='SENT')return r.sent;if(selectedView==='QUEUE')return r.queue;if(selectedView==='INTERESTED')return r.interested;if(selectedView==='WON')return r.won;return 0}
function viewColor(){return COLORS[selectedView]||COLORS.ALL}
function visibleRows(){if(selectedView==='ROADMAP')return[];return D.locations.filter(r=>viewMetric(r)>0)}
function countryMetrics(){const out={};if(selectedView==='ROADMAP'){D.roadmap.filter(r=>selectedQuarter==='ALL'||r.quarter===selectedQuarter).forEach(r=>{out[r.country]=(out[r.country]||0)+1});return out}visibleRows().forEach(r=>{out[r.country]=(out[r.country]||0)+viewMetric(r)});return out}
function styleCountry(name){const cm=countryMetrics(),v=cm[name]||0;if(!v)return{color:'#d7dde4',weight:.6,opacity:.65,fillColor:'#f5f7f9',fillOpacity:.72};if(selectedView==='ROADMAP'){const rs=D.roadmap.filter(r=>r.country===name&&(selectedQuarter==='ALL'||r.quarter===selectedQuarter));const q=rs[0]?.quarter||'Q4';return{color:COLORS[q],weight:1.5,opacity:.8,fillColor:COLORS[q],fillOpacity:.12}}const max=Math.max(...Object.values(cm),1),op=.10+Math.min(.28,(v/max)*.28);return{color:viewColor(),weight:1.3,opacity:.75,fillColor:viewColor(),fillOpacity:op}}
function redrawCountries(){if(countryLayer)map.removeLayer(countryLayer);if(!geo)return;countryLayer=L.geoJSON(geo,{style:f=>{const raw=f.properties.name||f.properties.ADMIN||'';return styleCountry(COUNTRY_ALIASES[raw]||raw)},onEachFeature:(f,l)=>{const raw=f.properties.name||f.properties.ADMIN||'';const name=COUNTRY_ALIASES[raw]||raw;l.on('click',()=>selectCountry(name));l.bindTooltip(()=>countryTooltip(name),{sticky:true})}}).addTo(map);countryLayer.bringToBack();if(gridLayer)gridLayer.bringToBack()}
function countryTooltip(name){const rows=D?.locations?.filter(r=>r.country===name)||[];if(selectedView==='ROADMAP'){const rr=D.roadmap.filter(r=>r.country===name&&(selectedQuarter==='ALL'||r.quarter===selectedQuarter));return rr.length?'<b>'+name+'</b><br>'+rr.length+' objetivos estratégicos':'<b>'+name+'</b>'}const val=rows.reduce((a,r)=>a+viewMetric(r),0);return '<b>'+name+'</b><br>'+val+' · '+viewLabel()}
function markerRadius(v){return Math.max(5,Math.min(15,5+Math.sqrt(v)*2.25))}
function redrawMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[];if(selectedView==='ROADMAP'){const rows=D.roadmap.filter(r=>selectedQuarter==='ALL'||r.quarter===selectedQuarter);rows.forEach(r=>{const c=COLORS[r.quarter],m=L.circleMarker([r.lat,r.lng],{radius:r.score>=94?8:6,color:'#fff',weight:2.2,fillColor:c,fillOpacity:.96}).addTo(map);m.bindTooltip('<b>'+r.name+'</b> · '+r.country+'<br>'+r.quarter+' · Match '+r.score);m.on('click',()=>showRoad(r));markers.push(m)});return}visibleRows().forEach(r=>{const v=viewMetric(r),m=L.circleMarker([r.lat,r.lng],{radius:markerRadius(v),color:'#fff',weight:2.2,fillColor:viewColor(),fillOpacity:.95}).addTo(map);m.bindTooltip('<b>'+r.name+'</b> · '+r.country+'<br>'+v+' · '+viewLabel());m.on('click',()=>showLocation(r));markers.push(m)})}
function viewLabel(){return({ALL:'oportunidades CRM',SENT:'outreach activo',QUEUE:'preparados / cola',INTERESTED:'interesados',WON:'conseguido',ROADMAP:'roadmap'})[selectedView]}
function renderViews(){const s=D.summary,items=[['ALL','Todo CRM',s.total],['SENT','📤 Outreach activo',s.outreachActive],['QUEUE','⏳ Preparados / cola',s.queue],['INTERESTED','★ Interesados',s.interested],['WON','✓ Conseguido',s.won],['ROADMAP','🧭 Roadmap 12M','']];document.getElementById('views').innerHTML=items.map(x=>`<button class="pill ${selectedView===x[0]?'active':''}" data-view="${x[0]}">${x[1]} ${x[2]!==''?`<span class="count">${x[2]}</span>`:''}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view))}
function renderFunnels(){const s=D.summary,items=[['ALL','Todos',s.total],['SUPPLY','Supply',s.supply],['PARTNER','Partners',s.partners],['INSTITUTION','Instituciones',s.institutions],['CAPITAL','Capital',s.capital],['CONTEST','Concursos',s.contests]];document.getElementById('funnels').innerHTML=items.map(x=>`<button class="pill ${selectedFunnel===x[0]?'active':''}" data-funnel="${x[0]}">${x[1]} <span class="count">${x[2]}</span></button>`).join('');document.querySelectorAll('[data-funnel]').forEach(b=>b.onclick=()=>{selectedFunnel=b.dataset.funnel;renderFunnels();redrawAll()})}
function renderQuarters(){const items=[['ALL','12 meses'],['Q4','Q4 2026'],['Q1','Q1 2027'],['Q2','Q2 2027'],['Q3','Q3 2027']];document.getElementById('quarters').innerHTML=items.map(x=>`<button class="pill ${selectedQuarter===x[0]?'active':''}" data-quarter="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-quarter]').forEach(b=>b.onclick=()=>{selectedQuarter=b.dataset.quarter;renderQuarters();redrawAll();fitCurrent()})}
function setView(v){selectedView=v;if(v!=='ALL')selectedFunnel='ALL';document.getElementById('funnelWrap').style.display=v==='ALL'?'block':'none';document.getElementById('quarterWrap').style.display=v==='ROADMAP'?'block':'none';document.getElementById('roadmapPanel').style.display=v==='ROADMAP'?'block':'none';renderViews();renderFunnels();redrawAll();fitCurrent();if(v==='WON'){const w=D.locations.filter(r=>r.won);if(w.length)showLocation(w[0])}else if(v==='ROADMAP'){renderRoadmap()}else showOverview()}
function redrawAll(){redrawCountries();redrawMarkers();renderMapMeta();renderLegend()}
function renderMapMeta(){let n;if(selectedView==='ALL'){n=D.locations.reduce((a,r)=>a+viewMetric(r),0)}else if(selectedView==='ROADMAP'){n=D.roadmap.filter(r=>selectedQuarter==='ALL'||r.quarter===selectedQuarter).length}else n=visibleRows().reduce((a,r)=>a+viewMetric(r),0);document.getElementById('mapMode').textContent=selectedView==='ROADMAP'?(selectedQuarter==='ALL'?'Roadmap 12 meses':selectedQuarter):viewLabel();document.getElementById('mapCount').textContent=n+' en mapa'}
function renderLegend(){const el=document.getElementById('legend');if(selectedView==='ROADMAP'){el.innerHTML='<span><i style="background:'+COLORS.Q4+'"></i>Q4 2026</span><span><i style="background:'+COLORS.Q1+'"></i>Q1 2027</span><span><i style="background:'+COLORS.Q2+'"></i>Q2 2027</span><span><i style="background:'+COLORS.Q3+'"></i>Q3 2027</span>';return}el.innerHTML=`<span><i style="background:${viewColor()}"></i>${viewLabel()}</span><span>● El tamaño del punto representa volumen</span><span>El fondo del país muestra intensidad</span>`}
function showOverview(){selectedLocation=null;document.getElementById('detail').innerHTML=`<div><div class="controlLabel">Lectura rápida</div><h2>${viewTitle()}</h2><p>${viewDescription()}</p><div class="metricGrid"><div class="mini"><b>${D.summary.mapped}</b><span>con ubicación</span></div><div class="mini"><b>${D.summary.unmapped}</b><span>sin ciudad exacta</span></div><div class="mini"><b>${D.summary.outreachMapped}</b><span>outreach visible</span></div><div class="mini"><b>${D.summary.interestedMapped}</b><span>interés visible</span></div><div class="mini"><b>${D.summary.won}</b><span>conseguido real</span></div></div></div><div class="breakdown"><div class="break">Supply <b>${D.summary.supply}</b></div><div class="break">Partners <b>${D.summary.partners}</b></div><div class="break">Instituciones <b>${D.summary.institutions}</b></div><div class="break">Concursos <b>${D.summary.contests}</b></div><div class="break">Capital <b>${D.summary.capital}</b></div><div class="break">CRM total <b>${D.summary.total}</b></div></div>`}
function viewTitle(){return({ALL:'Todo el CRM geolocalizable',SENT:'Dónde estamos disparando ahora',QUEUE:'Qué está preparado pero todavía no lanzado',INTERESTED:'Dónde existe interés comercial real',WON:'Mercados realmente conseguidos',ROADMAP:'Estrategia mundial por trimestres'})[selectedView]}
function viewDescription(){return({ALL:'Los 238 registros están contabilizados. Los 107 que tienen ciudad/ámbito geográfico explícito se representan en el mapa; los 131 restantes se mantienen como bloque sin ubicación para no inventar localizaciones.',SENT:'Outreach activo = Supply en ENVIADO + instituciones CONTACTADA. El mapa muestra 60 con ubicación; otros 62 están ya lanzados pero sin ciudad exacta en el CRM.',QUEUE:'Estado comercial COLA_ENVIO / preparado. No significa autorización técnica de TYR ni aprobación humana.',INTERESTED:'Solo etapas comerciales INTERESADO verificadas. No mezcla respuestas, nevera ni supuestos.',WON:'Criterio estricto: solo ACTIVO o CREANDO_EXPERIENCIA. Hoy son Barcelona, Tokio y Medellín.',ROADMAP:'Capa estratégica separada de los datos operativos. No convierte un objetivo futuro en un mercado conseguido.'})[selectedView]}
function showLocation(r){selectedLocation=r;document.getElementById('detail').innerHTML=`<div><div class="controlLabel">${r.scope==='country'?'Ámbito nacional':'Mercado CRM'}</div><h2>${r.name}</h2><p>${r.country}${r.won?` · <b style="color:${COLORS.WON}">${r.wonStage==='ACTIVO'?'Activo':'En creación'}</b>`:''}</p><div class="metricGrid"><div class="mini"><b>${r.total}</b><span>CRM total</span></div><div class="mini"><b>${r.sent}</b><span>outreach activo</span></div><div class="mini"><b>${r.queue}</b><span>preparados</span></div><div class="mini"><b>${r.interested}</b><span>interesados</span></div><div class="mini"><b>${r.won}</b><span>conseguido</span></div></div></div><div class="breakdown"><div class="break">Supply <b>${r.supply}</b></div><div class="break">Partners <b>${r.partners}</b></div><div class="break">Instituciones <b>${r.institutions}</b></div><div class="break">Capital <b>${r.capital}</b></div><div class="break">Concursos <b>${r.contests}</b></div><div class="break">Visible ahora <b>${viewMetric(r)}</b></div></div>`;map.flyTo([r.lat,r.lng],Math.max(map.getZoom(),4),{duration:.45})}
function selectCountry(name){if(selectedView==='ROADMAP'){const rr=D.roadmap.filter(r=>r.country===name&&(selectedQuarter==='ALL'||r.quarter===selectedQuarter));if(rr.length){showRoad(rr.sort((a,b)=>b.score-a.score)[0]);const b=L.latLngBounds(rr.map(r=>[r.lat,r.lng]));map.fitBounds(b.pad(.5),{maxZoom:5})}return}const rows=D.locations.filter(r=>r.country===name&&viewMetric(r)>0);if(!rows.length)return;const sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0);document.getElementById('detail').innerHTML=`<div><div class="controlLabel">País</div><h2>${name}</h2><p>${rows.length} mercados con datos CRM visibles en esta vista.</p><div class="metricGrid"><div class="mini"><b>${sum('total')}</b><span>CRM total</span></div><div class="mini"><b>${sum('sent')}</b><span>outreach activo</span></div><div class="mini"><b>${sum('queue')}</b><span>preparados</span></div><div class="mini"><b>${sum('interested')}</b><span>interesados</span></div><div class="mini"><b>${sum('won')}</b><span>conseguido</span></div></div></div><div class="breakdown">${rows.sort((a,b)=>viewMetric(b)-viewMetric(a)).slice(0,8).map(r=>`<div class="break">${r.name}<b>${viewMetric(r)}</b></div>`).join('')}</div>`;const b=L.latLngBounds(rows.map(r=>[r.lat,r.lng]));map.fitBounds(b.pad(.35),{maxZoom:5})}
function showRoad(r){document.getElementById('detail').innerHTML=`<div><div class="controlLabel">Objetivo estratégico · ${r.quarter}</div><h2>${r.name}</h2><p>${r.country}. Touryteller Match Score ${r.score}/100. Esta capa es estrategia, no estado comercial real.</p><div class="metricGrid"><div class="mini"><b>${r.score}</b><span>Match /100</span></div><div class="mini"><b>${r.quarter}</b><span>trimestre</span></div></div></div><div class="breakdown"><div class="break">CRM actual <b>${D.locations.find(x=>x.name===r.name)?.total||0}</b></div><div class="break">Outreach activo <b>${D.locations.find(x=>x.name===r.name)?.sent||0}</b></div></div>`;map.flyTo([r.lat,r.lng],Math.max(map.getZoom(),4),{duration:.45})}
function renderRoadmap(){const labels={ALL:['12 meses · expansión mundial','Q4 densifica Europa y señales existentes; Q1 abre beachheads globales; Q2 escala Asia/MENA/Oceanía; Q3 densifica los países que hayan demostrado conversión.'],Q4:['Q4 2026 · densidad','Convertir tracción existente antes de dispersarnos.'],Q1:['Q1 2027 · beachheads','América + Asia con alto potencial de demanda y efecto escaparate.'],Q2:['Q2 2027 · escala regional','Asia, MENA, África y Oceanía mediante partners y supply local.'],Q3:['Q3 2027 · efecto red','Segundas y terceras ciudades solo donde haya evidencia real de conversión.']};const [t,p]=labels[selectedQuarter];document.getElementById('roadTitle').textContent=t;document.getElementById('roadText').textContent=p;const rows=D.roadmap.filter(r=>selectedQuarter==='ALL'||r.quarter===selectedQuarter).sort((a,b)=>b.score-a.score);document.getElementById('roadCities').innerHTML=rows.slice(0,14).map(r=>`<div class="roadCity" data-road="${encodeURIComponent(r.name)}"><b>${r.name} · ${r.country}</b><small>${r.quarter}</small><span class="score">${r.score}/100</span></div>`).join('');document.querySelectorAll('[data-road]').forEach(el=>el.onclick=()=>{const n=decodeURIComponent(el.dataset.road);const r=D.roadmap.find(x=>x.name===n);if(r)showRoad(r)})}
function renderUnmapped(){const s=D.summary;document.getElementById('unmapped').innerHTML=`<div><b>${s.unmapped} registros del CRM sin ciudad exacta</b><p>No los colocamos artificialmente en el mapa. Dentro de este bloque hay 80 Supply, 36 Partners, 13 Concursos, 1 Capital y 1 registro sin tipo. De ellos, ${s.outreachUnmapped} están en outreach activo, ${s.queueUnmapped} en preparado/cola y ${s.interestedUnmapped} en interesado.</p></div><div class="big">${s.unmapped}</div>`}
function renderStats(){const s=D.summary;document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${s.total}</div><small>Oportunidades CRM</small><div class="sub">${s.mapped} ubicadas · ${s.unmapped} sin ciudad</div></div><div class="stat"><div class="n">${s.outreachActive}</div><small>Outreach activo</small><div class="sub">${s.outreachMapped} visibles en el mapa</div></div><div class="stat"><div class="n">${s.interested}</div><small>Interesados</small><div class="sub">${s.interestedMapped} con ubicación</div></div><div class="stat"><div class="n">${s.won}</div><small>Conseguido real</small><div class="sub">Barcelona · Tokio · Medellín</div></div>`}
function fitCurrent(){if(selectedView==='ROADMAP'){const rows=D.roadmap.filter(r=>selectedQuarter==='ALL'||r.quarter===selectedQuarter);if(!rows.length)return;selectedQuarter==='ALL'?fitWorld():map.fitBounds(L.latLngBounds(rows.map(r=>[r.lat,r.lng])).pad(.18),{maxZoom:4});return}const rows=visibleRows();if(!rows.length)return;if(selectedView==='ALL')fitWorld();else map.fitBounds(L.latLngBounds(rows.map(r=>[r.lat,r.lng])).pad(.18),{maxZoom:4})}
function fitWorld(){map.setView([22,10],2)}
function doSearch(q){const s=q.trim().toLocaleLowerCase();if(s.length<2)return;let r=D.locations.find(x=>x.name.toLocaleLowerCase().includes(s)||x.country.toLocaleLowerCase().includes(s));if(r){showLocation(r);return}r=D.roadmap.find(x=>x.name.toLocaleLowerCase().includes(s)||x.country.toLocaleLowerCase().includes(s));if(r){setView('ROADMAP');showRoad(r)}}
async function fullMap(){const el=document.getElementById('mapFocus');if(document.fullscreenElement){await document.exitFullscreen();return}try{if(el.requestFullscreen){await el.requestFullscreen();setTimeout(()=>map.invalidateSize(),180);return}}catch(e){}window.open(location.href,'_blank','noopener')}
document.getElementById('fullBtn').onclick=fullMap;document.getElementById('worldBtn').onclick=fitWorld;document.getElementById('search').addEventListener('input',e=>doSearch(e.target.value));document.getElementById('clearBtn').onclick=()=>{document.getElementById('search').value='';fitCurrent()};document.addEventListener('fullscreenchange',()=>setTimeout(()=>map.invalidateSize(),150));
Promise.all([fetch(DATA_URL+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('CRM data');return r.json()}),fetch(GEO_URL).then(r=>{if(!r.ok)throw new Error('Geo data');return r.json()})]).then(([data,g])=>{D=data;geo=g;document.getElementById('sync').innerHTML='● CRM · snapshot '+D.snapshotAt;renderStats();renderViews();renderFunnels();renderQuarters();renderUnmapped();showOverview();redrawAll();fitWorld()}).catch(err=>{document.getElementById('sync').style.color='#b42318';document.getElementById('sync').textContent='Error cargando datos';document.getElementById('detail').innerHTML='<div><h2>No se pudieron cargar los datos</h2><p>Recarga el mapa para reintentar.</p></div>'});
</script>
</body>
</html>
