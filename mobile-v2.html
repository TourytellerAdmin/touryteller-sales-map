<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Touryteller Sales Intelligence</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--ink:#0f172a;--muted:#64748b;--panel:rgba(255,255,255,.94);--line:#e2e8f0;--target:#cbd5e1;--won:#8b5cf6;--supply:#2563eb;--partner:#7c3aed;--inst:#059669;--capital:#d97706;--contest:#dc2626}*{box-sizing:border-box}html,body,#app,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink);background:#eef2f7}#app{position:relative;overflow:hidden}.top{position:absolute;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px}.head{display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:12px 14px;box-shadow:0 10px 34px rgba(15,23,42,.13)}.brand{min-width:0;flex:1}.brand b{display:block;font-size:17px;line-height:1.05}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini{display:flex;gap:8px}.mini div{min-width:58px;text-align:center;padding:7px 8px;background:#f8fafc;border:1px solid var(--line);border-radius:17px}.mini strong{display:block;font-size:17px}.mini small{font-size:9px;color:var(--muted)}.filters{display:flex;gap:7px;overflow-x:auto;padding:8px 4px 2px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{border:0;border-radius:16px;padding:10px 14px;background:#eef2f7;color:#334155;font-size:12px;font-weight:750;white-space:nowrap}.filters button.active{background:#0f172a;color:#fff}.tools{display:flex;gap:8px;margin-top:7px}.search{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.8);border-radius:17px;padding:10px 13px;box-shadow:0 8px 24px rgba(15,23,42,.09)}.search input{width:100%;border:0;outline:0;background:transparent;font-size:14px}.reset{border:0;border-radius:17px;background:#0f172a;color:#fff;padding:0 14px;font-weight:800}.legend{position:absolute;z-index:900;left:10px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--panel);backdrop-filter:blur(16px);padding:8px 10px;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.11);font-size:10px;font-weight:700;align-items:center}.sw{width:10px;height:10px;border-radius:4px;display:inline-block}.sheet{position:absolute;z-index:1100;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:24px;padding:12px 14px 14px;box-shadow:0 18px 60px rgba(15,23,42,.25);transform:translateY(125%);transition:.28s ease}.sheet.show{transform:translateY(0)}.handle{width:44px;height:5px;border-radius:99px;background:#cbd5e1;margin:0 auto 10px}.sheet h3{margin:0;font-size:18px}.status{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:6px 9px;border-radius:999px;background:#f1f5f9;font-size:11px;font-weight:800}.status.won{background:#ede9fe;color:#6d28d9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.cell{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:9px}.cell b{font-size:15px}.cell span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.stage{font-size:10px;font-weight:750;padding:6px 8px;border-radius:999px;background:#f1f5f9}.leaflet-control-zoom{margin-top:176px!important;margin-left:12px!important;border:0!important;box-shadow:0 8px 24px rgba(15,23,42,.16)!important}.leaflet-control-zoom a{border:0!important}.leaflet-popup-content-wrapper{border-radius:16px}.leaflet-container{background:#e8edf2}.won-halo{filter:drop-shadow(0 0 7px rgba(139,92,246,.8))}@media(min-width:760px){.top{left:18px;right:18px;top:16px}.brand b{font-size:20px}.filters{max-width:720px}.sheet{left:auto;right:18px;width:340px}.legend{left:18px;bottom:18px}}</style></head><body><div id="app"><div id="map"></div><div class="top"><div class="head"><div class="brand"><b>Touryteller · Sales Intelligence</b><span>Mercados conquistados vs. territorios por conquistar</span></div><div class="mini"><div><strong>218</strong><small>total</small></div><div><strong>86</strong><small>geo</small></div></div></div><div class="filters" id="filters"></div><div class="tools"><div class="search"><input id="search" placeholder="Buscar ciudad…"></div><button class="reset" id="reset">Ver todo</button></div></div><div class="legend"><span><i class="sw" style="background:#8b5cf6"></i> conseguido</span><span><i class="sw" style="background:#cbd5e1"></i> objetivo</span></div><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const TYPE={SUPPLY:{label:'Supply',color:'#2563eb'},PARTNER_LOCAL:{label:'Partners',color:'#7c3aed'},INSTITUCION:{label:'Instituciones',color:'#059669'},CAPITAL:{label:'Capital',color:'#d97706'},CONCURSO:{label:'Concursos',color:'#dc2626'}};const coords={'Budapest':[47.4979,19.0402],'Madrid':[40.4168,-3.7038],'París':[48.8566,2.3522],'Dublín':[53.3498,-6.2603],'Roma':[41.9028,12.4964],'Londres':[51.5072,-0.1276],'Tokio':[35.6895,139.6917],'Barcelona':[41.3851,2.1734],'Dubrovnik':[42.6507,18.0944],'Berlín':[52.52,13.405],'Praga':[50.0755,14.4378],'Cracovia':[50.0647,19.945],'Kraków':[50.0647,19.945],'Estambul':[41.0082,28.9784],'Toledo':[39.8628,-4.0273],'Ámsterdam':[52.3676,4.9041],'Oporto':[41.1579,-8.6291],'Florencia':[43.7696,11.2558],'Badalona':[41.45,2.245],'Granada':[37.1773,-3.5986],'València':[39.4699,-0.3763],'Medellín':[6.2442,-75.5812],'Salou':[41.0778,1.131],'Lloret de Mar':[41.6999,2.8456],'Sevilla':[37.3891,-5.9845],'Tenerife':[28.4636,-16.2518],'Costa Brava / Girona':[41.9794,2.8214],'Lisboa':[38.7223,-9.1393],'Viena':[48.2082,16.3738],'Sitges':[41.2372,1.8119]};const cityCountry={'Budapest':'Hungary','Madrid':'Spain','París':'France','Dublín':'Ireland','Roma':'Italy','Londres':'United Kingdom','Tokio':'Japan','Barcelona':'Spain','Dubrovnik':'Croatia','Berlín':'Germany','Praga':'Czech Republic','Cracovia':'Poland','Kraków':'Poland','Estambul':'Turkey','Toledo':'Spain','Ámsterdam':'Netherlands','Oporto':'Portugal','Florencia':'Italy','Badalona':'Spain','Granada':'Spain','València':'Spain','Medellín':'Colombia','Salou':'Spain','Lloret de Mar':'Spain','Sevilla':'Spain','Tenerife':'Spain','Costa Brava / Girona':'Spain','Lisboa':'Portugal','Viena':'Austria','Sitges':'Spain'};const raw=[['Budapest','SUPPLY',6],['Tokio','SUPPLY',5],['Madrid','SUPPLY',5],['Roma','SUPPLY',4],['París','SUPPLY',4],['Dublín','SUPPLY',4],['Londres','SUPPLY',4],['Toledo','SUPPLY',3],['Cracovia','SUPPLY',3],['Praga','SUPPLY',3],['Dubrovnik','SUPPLY',3],['Estambul','SUPPLY',3],['Berlín','SUPPLY',3],['Dublín','PARTNER_LOCAL',2],['Badalona','INSTITUCION',1],['Ámsterdam','SUPPLY',1],['Ámsterdam','PARTNER_LOCAL',1],['Medellín','SUPPLY',1],['Oporto','INSTITUCION',1],['València','INSTITUCION',1],['Lisboa','INSTITUCION',1],['París','INSTITUCION',1],['Kraków','INSTITUCION',1],['Lloret de Mar','INSTITUCION',1],['Granada','SUPPLY',1],['Budapest','INSTITUCION',1],['Praga','INSTITUCION',1],['Roma','INSTITUCION',1],['Barcelona','SUPPLY',1],['Florencia','PARTNER_LOCAL',1],['Sitges','INSTITUCION',1],['Oporto','SUPPLY',1],['Sevilla','CONCURSO',1],['Salou','INSTITUCION',1],['Barcelona','PARTNER_LOCAL',1],['París','PARTNER_LOCAL',1],['Londres','PARTNER_LOCAL',1],['Dubrovnik','INSTITUCION',1],['Roma','PARTNER_LOCAL',1],['Barcelona','INSTITUCION',1],['Berlín','PARTNER_LOCAL',1],['Barcelona','CAPITAL',1],['Costa Brava / Girona','INSTITUCION',1],['Tenerife','INSTITUCION',1],['Viena','PARTNER_LOCAL',1],['Madrid','INSTITUCION',1]];const stages={'Budapest':{ENVIADO:6},'Madrid':{ENVIADO:4,INTERESADO:1},'Tokio':{ENVIADO:3,CREANDO_EXPERIENCIA:1,COLA_ENVIO:1},'Roma':{ENVIADO:3,INTERESADO:1},'Londres':{ENVIADO:3,COLA_ENVIO:1},'Cracovia':{ENVIADO:3},'Estambul':{ENVIADO:3},'París':{ENVIADO:3,NO_INTERESADO:1},'Berlín':{ENVIADO:2,NO_INTERESADO:1},'Toledo':{ENVIADO:2,NO_INTERESADO:1},'Dublín':{ENVIADO:2,NEVERA:1,COLA_ENVIO:1},'Dubrovnik':{ENVIADO:2,NO_INTERESADO:1},'Oporto':{INTERESADO:1},'Medellín':{CREANDO_EXPERIENCIA:1},'Praga':{PROSPECTO:1,ENVIADO:1,NO_INTERESADO:1},'Granada':{ENVIADO:1},'Ámsterdam':{ENVIADO:1},'Barcelona':{ACTIVO:1}};const wonCities=new Set(Object.entries(stages).filter(([c,s])=>s.CREANDO_EXPERIENCIA||s.ACTIVO||s.REUNION_AGENDADA).map(([c])=>c));const targetCountries=new Set(Object.values(cityCountry));const wonCountries=new Set([...wonCities].map(c=>cityCountry[c]).filter(Boolean));const data={};raw.forEach(([city,type,n])=>{if(!coords[city])return;data[city]??={city,lat:coords[city][0],lng:coords[city][1],country:cityCountry[city],types:{},total:0};data[city].types[type]=(data[city].types[type]||0)+n;data[city].total+=n});Object.values(data).forEach(d=>d.stages=stages[d.city]||{});const map=L.map('map',{zoomControl:true,worldCopyJump:true,minZoom:2,zoomSnap:.5});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:20,opacity:.7}).addTo(map);fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json').then(r=>r.json()).then(g=>L.geoJSON(g,{style:f=>{const n=f.properties.name;if(wonCountries.has(n))return{color:'#7c3aed',weight:1,fillColor:'#8b5cf6',fillOpacity:.26};if(targetCountries.has(n))return{color:'#94a3b8',weight:.7,fillColor:'#cbd5e1',fillOpacity:.18};return{color:'#e2e8f0',weight:.4,fillOpacity:0}},onEachFeature:(f,l)=>{const n=f.properties.name;if(wonCountries.has(n))l.bindTooltip(n+' · conseguido');else if(targetCountries.has(n))l.bindTooltip(n+' · objetivo')}}).addTo(map)).catch(()=>{});let active='ALL',layer=L.layerGroup().addTo(map);function dominant(d){return Object.entries(d.types).sort((a,b)=>b[1]-a[1])[0]?.[0]||'SUPPLY'}function countFor(d){return active==='ALL'?d.total:(d.types[active]||0)}function statusLabel(s){return({ACTIVO:'Activo',CREANDO_EXPERIENCIA:'Onboarding / creando tours',INTERESADO:'Interesado',COLA_ENVIO:'Cola envío',ENVIADO:'Enviado',NEVERA:'Nevera',NO_INTERESADO:'No interesado',PROSPECTO:'Prospecto'})[s]||s}function render(){layer.clearLayers();const visible=Object.values(data).filter(d=>countFor(d)>0);const bounds=[];visible.forEach(d=>{const n=countFor(d),dom=active==='ALL'?dominant(d):active,won=wonCities.has(d.city);if(won)L.circleMarker([d.lat,d.lng],{radius:16+Math.sqrt(n)*4,color:'#8b5cf6',weight:3,fillColor:'#8b5cf6',fillOpacity:.12,className:'won-halo'}).addTo(layer);const m=L.circleMarker([d.lat,d.lng],{radius:7+Math.sqrt(n)*3.5,color:won?'#7c3aed':'#fff',weight:won?4:2.5,fillColor:TYPE[dom].color,fillOpacity:.9});m.bindTooltip(`${d.city} · ${n}${won?' · conseguido':''}`,{direction:'top'});m.on('click',()=>show(d));m.addTo(layer);bounds.push([d.lat,d.lng])});if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[28,200],paddingBottomRight:[28,60],maxZoom:4})}function show(d){const won=wonCities.has(d.city);const types=Object.entries(d.types).map(([t,n])=>`<div class="cell"><b>${n}</b><span>${TYPE[t].label}</span></div>`).join('');const ss=Object.entries(d.stages).map(([s,n])=>`<span class="stage">${statusLabel(s)} · ${n}</span>`).join('');document.getElementById('sheetBody').innerHTML=`<h3>${d.city}</h3><div class="status ${won?'won':''}">${won?'Conseguido · onboarding/primeros tours':'Objetivo por conquistar'} · ${d.country||''}</div><div class="grid">${types}</div><div class="stages">${ss||'<span class="stage">Sin etapa Supply avanzada</span>'}</div>`;document.getElementById('sheet').classList.add('show');map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),5),{duration:.5})}const f=document.getElementById('filters');[['ALL','Todo'],['SUPPLY','Supply'],['PARTNER_LOCAL','Partners'],['INSTITUCION','Instituciones'],['CAPITAL','Capital'],['CONCURSO','Concursos']].forEach(([k,l],i)=>{const b=document.createElement('button');b.textContent=l;b.className=i?'':'active';b.onclick=()=>{active=k;[...f.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('sheet').classList.remove('show');render()};f.appendChild(b)});document.getElementById('reset').onclick=()=>{map.setView([35,15],2.5);render()};document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const d=Object.values(data).find(x=>x.city.toLowerCase().includes(q));if(d){map.flyTo([d.lat,d.lng],6);show(d)}});map.on('click',()=>document.getElementById('sheet').classList.remove('show'));render();</script></body></html>
