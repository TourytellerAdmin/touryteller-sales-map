function crmScore(c){if(c.stage==='WON')return 100;if(c.crm>=6)return 90;if(c.crm>=4)return 80;if(c.crm>=2)return 65;if(c.crm===1)return 55;return 25}function score(c){if(c.stage==='WON')return 100;return Math.round(c.walk*.30+crmScore(c)*.20+c.fit*.20+c.momentum*.15+c.div*.10+c.event*.05)}function tier(c){if(c.stage==='WON')return'WON';const s=score(c);return s>=82?'NOW':s>=72?'NEXT':'WATCH'}function tierLabel(t){return t==='WON'?'Conseguido · escalar':t==='NOW'?'Prioridad A · atacar ahora':t==='NEXT'?'Prioridad B · siguiente ola':'Sembrar / observar'}function nextAction(c){const t=tier(c);if(t==='WON')return'Escalar oferta: asegurar 2–3 creadores/operadores, activar una institución local y convertir el mercado en caso de éxito.';if(t==='NOW'&&c.crm>=2)return'Cerrar tracción existente: priorizar respuestas, identificar el mejor lead y llevar al menos 1 creador a onboarding en 30 días.';if(t==='NOW')return'Prospección intensiva: 10 leads de alta calidad + 2 partners/instituciones y objetivo de 1 onboarding en 30–45 días.';if(t==='NEXT')return'Sembrar 5–8 leads cualificados, validar respuesta y promover a Prioridad A si aparece señal positiva.';return'Mantener radar: 2–3 leads de exploración y elevar prioridad solo con evidencia de demanda o respuesta.'}cities.forEach(c=>{c.score=score(c);c.tier=tier(c)});document.getElementById('nowCount').textContent=cities.filter(c=>c.tier==='NOW').length;
const map=L.map('map',{zoomControl:true,worldCopyJump:true,minZoom:2,zoomSnap:.5});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:20,opacity:.68}).addTo(map);const countryTier={};cities.forEach(c=>{const rank={WATCH:1,NEXT:2,NOW:3,WON:4};if(!countryTier[c.country]||rank[c.tier]>rank[countryTier[c.country]])countryTier[c.country]=c.tier});fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json').then(r=>r.json()).then(g=>L.geoJSON(g,{style:f=>{const t=countryTier[f.properties.name];if(!t)return{color:'#dbe3ec',weight:.45,fillOpacity:0};return{color:COLORS[t],weight:t==='WON'?1.2:.8,fillColor:COLORS[t],fillOpacity:t==='WON'?.22:t==='NOW'?.18:t==='NEXT'?.12:.07}},onEachFeature:(f,l)=>{const t=countryTier[f.properties.name];if(t)l.bindTooltip(f.properties.name+' · '+tierLabel(t))}}).addTo(map)).catch(()=>{});
let active='ALL',layer=L.layerGroup().addTo(map);function visible(c){return active==='ALL'||c.tier===active}function render(){layer.clearLayers();const arr=cities.filter(visible),bounds=[];arr.forEach(c=>{if(c.tier==='WON')L.circleMarker([c.lat,c.lng],{radius:18,color:COLORS.WON,weight:3,fillColor:COLORS.WON,fillOpacity:.10,className:'pulse'}).addTo(layer);const m=L.circleMarker([c.lat,c.lng],{radius:c.tier==='NOW'?10:c.tier==='WON'?10:8,color:'#fff',weight:2.5,fillColor:COLORS[c.tier],fillOpacity:.95});m.bindTooltip(`<b>${c.name}</b> · ${c.score}/100<br>${tierLabel(c.tier)}`,{direction:'top'});m.on('click',()=>showCity(c));m.addTo(layer);bounds.push([c.lat,c.lng])});if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[35,190],paddingBottomRight:[35,55],maxZoom:3.4})}function showCity(c){document.getElementById('sheetBody').innerHTML=`<h3>${c.name} · ${c.country}</h3><div class="status ${c.tier.toLowerCase()}">${tierLabel(c.tier)}</div><div class="score"><b>${c.score}</b><span>TOURYTELLER<br>MATCH SCORE</span></div><div class="why">${c.why}</div><div class="factors"><div class="factor"><b>${c.rank?'#'+c.rank:'—'}</b><span>GuruWalk 2026</span></div><div class="factor"><b>${c.crm}</b><span>oportunidades CRM</span></div><div class="factor"><b>${c.fit}</b><span>encaje experiencial</span></div><div class="factor"><b>${c.momentum}</b><span>momentum mercado</span></div><div class="factor"><b>${c.div}</b><span>diversificación</span></div><div class="factor"><b>${c.event}</b><span>catalizador 2026</span></div></div><div class="nextact"><b>Siguiente paso</b><br>${nextAction(c)}</div>`;document.getElementById('sheet').classList.add('show');map.flyTo([c.lat,c.lng],Math.max(map.getZoom(),5),{duration:.45})}function showPlan(){const sorted=[...cities].filter(c=>c.tier!=='WON').sort((a,b)=>b.score-a.score).slice(0,15);document.getElementById('sheetBody').innerHTML=`<h3>Plan mundial 2026</h3><div class="why">Orden recomendado por Touryteller Match Score. Primero mercados A, manteniendo equilibrio entre Europa, Américas, Asia, África y Oceanía.</div>${sorted.map((c,i)=>`<div class="rank"><div class="n">${i+1}</div><button data-city="${c.name}"><div class="city">${c.name}</div><div class="sub">${c.country} · ${tierLabel(c.tier)}</div></button><div class="badge">${c.score}</div></div>`).join('')}<div class="model"><b>Algoritmo:</b> 30% demanda walking/free tours · 20% tracción CRM · 20% encaje con experiencia Touryteller · 15% momentum turístico · 10% diversificación internacional · 5% catalizadores 2026. Los datos externos sirven para priorizar; el CRM manda cuando aparece evidencia real.</div>`;document.getElementById('sheet').classList.add('show');document.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>{const c=cities.find(x=>x.name===b.dataset.city);if(c)showCity(c)}))}
const f=document.getElementById('filters');[['ALL','Todo'],['WON','Conseguido'],['NOW','Prioridad A'],['NEXT','Prioridad B'],['WATCH','Sembrar']].forEach(([k,l],i)=>{const b=document.createElement('button');b.textContent=l;b.className=i?'':'active';b.addEventListener('click',()=>{active=k;[...f.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('sheet').classList.remove('show');render()});f.appendChild(b)});document.getElementById('reset').addEventListener('click',()=>{active='ALL';[...f.children].forEach((x,i)=>x.classList.toggle('active',i===0));document.getElementById('sheet').classList.remove('show');render()});document.getElementById('plan').addEventListener('click',showPlan);document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2)return;const c=cities.find(x=>x.name.toLowerCase().includes(q)||x.country.toLowerCase().includes(q));if(c)showCity(c)});map.on('click',()=>document.getElementById('sheet').classList.remove('show'));render();</script></body></html>
