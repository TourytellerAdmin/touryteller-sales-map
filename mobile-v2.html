<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Touryteller Global Expansion</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--ink:#0f172a;--muted:#64748b;--panel:rgba(255,255,255,.96);--line:#e2e8f0;--won:#8b5cf6;--now:#f59e0b;--next:#fb923c;--watch:#94a3b8;--accent:#111827;--bg:#eef2f7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body,#app,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overscroll-behavior:none}button,input{font:inherit}button{touch-action:manipulation}.app{position:relative;height:100%;overflow:hidden}.top{position:absolute;z-index:1200;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:grid;gap:7px}.hero{display:flex;gap:10px;align-items:center;background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:11px 12px;box-shadow:0 10px 34px rgba(15,23,42,.14)}.brand{min-width:0;flex:1}.brand b{display:block;font-size:17px;line-height:1.04}.brand span{display:block;font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpis{display:flex;gap:6px}.kpi{min-width:52px;text-align:center;background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:6px 7px}.kpi strong{display:block;font-size:16px;line-height:1}.kpi small{font-size:8px;color:var(--muted)}.seg{display:flex;gap:5px;background:var(--panel);backdrop-filter:blur(20px);padding:5px;border-radius:18px;border:1px solid rgba(255,255,255,.85);overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{border:0;background:transparent;color:#475569;border-radius:13px;padding:9px 12px;font-size:11px;font-weight:800;white-space:nowrap;min-height:38px}.seg button.active{background:var(--accent);color:#fff}.toolbar{display:flex;gap:7px}.search{flex:1;background:var(--panel);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.85);border-radius:17px;padding:10px 12px;box-shadow:0 7px 22px rgba(15,23,42,.08)}.search input{width:100%;border:0;outline:0;background:transparent;font-size:16px}.native-btn{border:0;border-radius:17px;background:var(--accent);color:#fff;padding:0 14px;min-height:44px;font-weight:850;font-size:11px}.fab{position:absolute;z-index:1100;right:10px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;gap:8px}.fab button{width:48px;height:48px;border-radius:16px;border:0;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 8px 26px rgba(15,23,42,.16);font-size:18px;font-weight:900;color:var(--ink)}.fab button.primary{background:var(--accent);color:#fff}.legend{position:absolute;z-index:1000;left:10px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--panel);backdrop-filter:blur(18px);padding:7px 9px;border-radius:15px;box-shadow:0 8px 24px rgba(15,23,42,.12);font-size:9px;font-weight:800;max-width:calc(100% - 78px);overflow-x:auto}.legend span{white-space:nowrap}.sw{display:inline-block;width:9px;height:9px;border-radius:4px;margin-right:3px}.sheet{position:absolute;z-index:1500;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.99);border:1px solid var(--line);border-radius:25px;padding:10px 12px 14px;box-shadow:0 22px 70px rgba(15,23,42,.28);transform:translateY(125%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:74%;overflow:auto;-webkit-overflow-scrolling:touch}.sheet.show{transform:translateY(0)}.handle{width:42px;height:4px;border-radius:99px;background:#cbd5e1;margin:0 auto 10px}.sheet-head{display:flex;gap:10px;align-items:start}.sheet-head h3{margin:0;font-size:19px;line-height:1.1}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:12px;background:#f1f5f9;font-weight:900}.status{display:inline-flex;margin-top:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850}.status.won{background:#ede9fe;color:#6d28d9}.status.now{background:#fef3c7;color:#92400e}.status.next{background:#ffedd5;color:#9a3412}.status.watch{background:#f1f5f9;color:#475569}.score-row{display:flex;align-items:center;gap:10px;margin-top:10px}.score{font-size:34px;font-weight:900;letter-spacing:-1px}.score-meta{font-size:10px;color:var(--muted);line-height:1.35}.why{font-size:11px;line-height:1.48;margin-top:10px;color:#334155}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metric{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:8px}.metric b{font-size:14px}.metric span{display:block;font-size:8px;color:var(--muted);margin-top:2px}.nextact{margin-top:10px;padding:10px 11px;border-radius:15px;background:#f8fafc;border:1px solid var(--line);font-size:11px;line-height:1.45}.queue{margin-top:8px}.qrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #f1f5f9}.qrow button{border:0;background:transparent;text-align:left;padding:0;color:inherit}.qrow .n{font-size:10px;color:#94a3b8}.qrow .city{font-size:12px;font-weight:850}.qrow .sub{font-size:9px;color:var(--muted);margin-top:2px}.badge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:10px;background:#f8fafc}.leaflet-control-zoom{margin-top:178px!important;margin-left:10px!important;border:0!important;box-shadow:0 8px 24px rgba(15,23,42,.16)!important}.leaflet-control-zoom a{border:0!important}.leaflet-container{background:#e8edf2}.leaflet-tooltip{border:0!important;border-radius:12px!important;box-shadow:0 8px 22px rgba(15,23,42,.16)!important;font-size:10px!important;font-weight:800!important}.pulse{filter:drop-shadow(0 0 8px rgba(139,92,246,.8))}@media(min-width:760px){.top{left:18px;right:18px;top:16px}.hero{max-width:720px}.brand b{font-size:20px}.seg{max-width:720px}.toolbar{max-width:720px}.sheet{left:auto;right:18px;width:390px}.legend{left:18px;bottom:18px}.fab{right:18px;bottom:18px}}@media(max-width:390px){.brand span{max-width:170px}.kpi{min-width:48px}.seg button{padding:9px 10px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}</style></head><body><div id="app" class="app"><div id="map"></div><div class="top"><div class="hero"><div class="brand"><b>Touryteller · Global Expansion</b><span>Mapa de conquista · decisión comercial mundial</span></div><div class="kpis"><div class="kpi"><strong id="wonCount">0</strong><small>ganados</small></div><div class="kpi"><strong id="aCount">0</strong><small>atacar</small></div></div></div><div class="seg" id="filters"></div><div class="toolbar"><div class="search"><input id="search" aria-label="Buscar ciudad o país" placeholder="Buscar ciudad o país…"></div><button class="native-btn" id="world">Mundo</button></div></div><div class="legend"><span><i class="sw" style="background:#8b5cf6"></i>conseguido</span><span><i class="sw" style="background:#f59e0b"></i>atacar</span><span><i class="sw" style="background:#fb923c"></i>siguiente</span><span><i class="sw" style="background:#94a3b8"></i>sembrar</span></div><div class="fab"><button id="queue" class="primary" aria-label="Abrir plan mundial">≡</button><button id="fit" aria-label="Encajar mapa">⌾</button></div><div class="sheet" id="sheet" role="dialog" aria-modal="false"><div class="handle"></div><div id="sheetBody"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const COLORS={WON:'#8b5cf6',NOW:'#f59e0b',NEXT:'#fb923c',WATCH:'#94a3b8'};const cities=[{name:'Barcelona',country:'España',lat:41.3851,lng:2.1734,region:'Europa',walk:93,crm:4,stage:'WON',fit:94,momentum:72,div:55,event:90,why:'Mercado base y escaparate internacional. Prioridad: convertir la presencia en caso de éxito replicable.'},{name:'Tokio',country:'Japón',lat:35.6895,lng:139.6917,region:'Asia',walk:81,crm:5,stage:'WON',fit:95,momentum:96,div:96,event:72,why:'Tracción real y encaje muy alto con experiencias culturales urbanas.'},{name:'Medellín',country:'Colombia',lat:6.2442,lng:-75.5812,region:'LatAm',walk:66,crm:1,stage:'WON',fit:87,momentum:90,div:94,event:65,why:'Ancla latinoamericana y fuerte potencial de autenticidad local.'},{name:'Roma',country:'Italia',lat:41.9028,lng:12.4964,region:'Europa',walk:100,crm:5,stage:'OPEN',fit:98,momentum:72,div:58,event:70,why:'Demanda walking excepcional y densidad histórica ideal para storytelling y checkpoints.'},{name:'Madrid',country:'España',lat:40.4168,lng:-3.7038,region:'Europa',walk:99,crm:6,stage:'OPEN',fit:94,momentum:72,div:45,event:78,why:'Alta demanda y tracción CRM. Puede activarse rápido con operadores locales.'},{name:'Budapest',country:'Hungría',lat:47.4979,lng:19.0402,region:'Europa',walk:98,crm:7,stage:'OPEN',fit:94,momentum:78,div:70,event:65,why:'Máxima densidad CRM y fuerte cultura de walking tours.'},{name:'Praga',country:'Chequia',lat:50.0755,lng:14.4378,region:'Europa',walk:97,crm:4,stage:'OPEN',fit:95,momentum:78,div:68,event:65,why:'Ciudad compacta, monumental y muy adecuada para narrativa gamificada.'},{name:'Lisboa',country:'Portugal',lat:38.7223,lng:-9.1393,region:'Europa',walk:96,crm:1,stage:'OPEN',fit:94,momentum:72,div:62,event:70,why:'Ecosistema maduro de free tours y gran atractivo internacional.'},{name:'Ámsterdam',country:'Países Bajos',lat:52.3676,lng:4.9041,region:'Europa',walk:95,crm:2,stage:'OPEN',fit:90,momentum:72,div:65,event:63,why:'Alta demanda internacional y excelente encaje temático.'},{name:'Oporto',country:'Portugal',lat:41.1579,lng:-8.6291,region:'Europa',walk:94,crm:2,stage:'OPEN',fit:92,momentum:72,div:63,event:64,why:'Alta demanda walking y señal de interés en CRM.'},{name:'Londres',country:'Reino Unido',lat:51.5072,lng:-0.1276,region:'Europa',walk:92,crm:5,stage:'OPEN',fit:95,momentum:74,div:60,event:82,why:'Escala global y enorme variedad temática.'},{name:'Berlín',country:'Alemania',lat:52.52,lng:13.405,region:'Europa',walk:91,crm:4,stage:'OPEN',fit:93,momentum:74,div:64,event:66,why:'Historia urbana y subculturas: excelente terreno para experiencias narrativas.'},{name:'Estambul',country:'Turquía',lat:41.0082,lng:28.9784,region:'Oriente Medio',walk:88,crm:3,stage:'OPEN',fit:96,momentum:86,div:88,event:74,why:'Cruce Europa-Asia, enorme riqueza visual, histórica y gastronómica.'},{name:'Cracovia',country:'Polonia',lat:50.0647,lng:19.945,region:'Europa',walk:87,crm:4,stage:'OPEN',fit:94,momentum:80,div:67,event:64,why:'Fuerte afinidad con walking tours y tracción CRM existente.'},{name:'Dublín',country:'Irlanda',lat:53.3498,lng:-6.2603,region:'Europa',walk:84,crm:6,stage:'OPEN',fit:91,momentum:82,div:69,event:62,why:'Alta densidad CRM y crecimiento del walking urbano.'},{name:'Nueva York',country:'Estados Unidos',lat:40.7128,lng:-74.006,region:'Norteamérica',walk:79,crm:0,stage:'OPEN',fit:98,momentum:82,div:96,event:100,why:'Mercado global, enorme densidad temática y alto valor de marca internacional.'},{name:'Ciudad de México',country:'México',lat:19.4326,lng:-99.1332,region:'LatAm',walk:78,crm:0,stage:'OPEN',fit:98,momentum:92,div:96,event:100,why:'Densidad cultural excepcional y gran potencial para expansión latinoamericana.'},{name:'Santiago',country:'Chile',lat:-33.4489,lng:-70.6693,region:'LatAm',walk:77,crm:0,stage:'OPEN',fit:88,momentum:94,div:94,event:64,why:'Buen vector de entrada en el Cono Sur y crecimiento del turismo urbano.'},{name:'Buenos Aires',country:'Argentina',lat:-34.6037,lng:-58.3816,region:'LatAm',walk:76,crm:0,stage:'OPEN',fit:96,momentum:92,div:94,event:68,why:'Barrios, cultura y narrativa urbana de gran profundidad.'},{name:'Kioto',country:'Japón',lat:35.0116,lng:135.7681,region:'Asia',walk:75,crm:0,stage:'OPEN',fit:99,momentum:96,div:78,event:68,why:'Uno de los mejores encajes de producto por patrimonio, rituales y cultura local.'},{name:'Seúl',country:'Corea del Sur',lat:37.5665,lng:126.978,region:'Asia',walk:74,crm:0,stage:'OPEN',fit:95,momentum:95,div:96,event:76,why:'Gran mezcla de cultura, tecnología, barrios y consumo de experiencias.'},{name:'Bangkok',country:'Tailandia',lat:13.7563,lng:100.5018,region:'Asia',walk:73,crm:0,stage:'OPEN',fit:95,momentum:96,div:98,event:72,why:'Gran volumen internacional y alto encaje con gastronomía y vida urbana.'},{name:'Singapur',country:'Singapur',lat:1.3521,lng:103.8198,region:'Asia',walk:70,crm:0,stage:'OPEN',fit:87,momentum:88,div:98,event:74,why:'Hub internacional útil para validar el producto en Asia premium.'},{name:'Dubái',country:'EAU',lat:25.2048,lng:55.2708,region:'Oriente Medio',walk:68,crm:0,stage:'OPEN',fit:82,momentum:92,div:95,event:82,why:'Hub global con capacidad de partnerships e instituciones.'},{name:'Marrakech',country:'Marruecos',lat:31.6295,lng:-7.9811,region:'África',walk:72,crm:0,stage:'OPEN',fit:97,momentum:91,div:99,event:66,why:'Experiencia sensorial, patrimonio y narrativa local muy alineados con Touryteller.'},{name:'Ciudad del Cabo',country:'Sudáfrica',lat:-33.9249,lng:18.4241,region:'África',walk:65,crm:0,stage:'OPEN',fit:90,momentum:86,div:100,event:65,why:'Ancla africana con fuerte mezcla de cultura, naturaleza e historia.'},{name:'Sídney',country:'Australia',lat:-33.8688,lng:151.2093,region:'Oceanía',walk:67,crm:0,stage:'OPEN',fit:89,momentum:84,div:100,event:68,why:'Mercado de alto valor y puerta de entrada a Oceanía.'},{name:'Toronto',country:'Canadá',lat:43.6532,lng:-79.3832,region:'Norteamérica',walk:69,crm:0,stage:'OPEN',fit:86,momentum:84,div:94,event:72,why:'Mercado multicultural y buen laboratorio de experiencias urbanas.'}];function crmScore(c){if(c.stage==='WON')return 100;if(c.crm>=6)return 90;if(c.crm>=4)return 80;if(c.crm>=2)return 65;if(c.crm===1)return 55;return 25}function score(c){if(c.stage==='WON')return 100;return Math.round(c.walk*.30+crmScore(c)*.20+c.fit*.20+c.momentum*.15+c.div*.10+c.event*.05)}function tier(c){if(c.stage==='WON')return'WON';const s=score(c);return s>=82?'NOW':s>=72?'NEXT':'WATCH'}function tierLabel(t){return t==='WON'?'Conseguido · escalar':t==='NOW'?'Prioridad A · atacar ahora':t==='NEXT'?'Prioridad B · siguiente ola':'Sembrar / observar'}function nextAction(c){if(c.stage==='WON')return'Escalar: asegurar varios creadores/operadores, activar una institución local y convertir el mercado en caso de éxito.';if(c.crm>=2&&c.tier==='NOW')return'Cerrar tracción existente: priorizar respuestas y llevar al menos un creador a onboarding.';if(c.tier==='NOW')return'Prospección intensiva: 10 leads de alta calidad + 2 partners/instituciones y objetivo de 1 onboarding.';if(c.tier==='NEXT')return'Sembrar 5–8 leads cualificados y promover a Prioridad A en cuanto aparezca señal positiva.';return'Mantener radar con 2–3 leads de exploración y elevar prioridad solo con evidencia.'}cities.forEach(c=>{c.score=score(c);c.tier=tier(c)});document.getElementById('wonCount').textContent=cities.filter(c=>c.tier==='WON').length;document.getElementById('aCount').textContent=cities.filter(c=>c.tier==='NOW').length;const map=L.map('map',{zoomControl:true,worldCopyJump:true,minZoom:2,zoomSnap:.5,tap:true});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:20,opacity:.68}).addTo(map);let active='ALL',layer=L.layerGroup().addTo(map);function visible(c){return active==='ALL'||c.tier===active}function render(){layer.clearLayers();const arr=cities.filter(visible),bounds=[];arr.forEach(c=>{if(c.tier==='WON')L.circleMarker([c.lat,c.lng],{radius:18,color:COLORS.WON,weight:3,fillColor:COLORS.WON,fillOpacity:.10,className:'pulse'}).addTo(layer);const m=L.circleMarker([c.lat,c.lng],{radius:c.tier==='NOW'?11:c.tier==='WON'?10:8,color:'#fff',weight:2.5,fillColor:COLORS[c.tier],fillOpacity:.96});m.bindTooltip('<b>'+c.name+'</b> · '+c.score+'/100<br>'+tierLabel(c.tier),{direction:'top'});m.on('click',()=>showCity(c));m.addTo(layer);bounds.push([c.lat,c.lng])});if(bounds.length)map.fitBounds(bounds,{paddingTopLeft:[35,205],paddingBottomRight:[35,70],maxZoom:3.5})}function showCity(c){document.getElementById('sheetBody').innerHTML='<div class="sheet-head"><div><h3>'+c.name+' · '+c.country+'</h3><div class="status '+c.tier.toLowerCase()+'">'+tierLabel(c.tier)+'</div></div><button class="close" id="closeSheet" aria-label="Cerrar">×</button></div><div class="score-row"><div class="score">'+c.score+'</div><div class="score-meta">TOURYTELLER MATCH SCORE<br>'+c.region+'</div></div><div class="why">'+c.why+'</div><div class="metrics"><div class="metric"><b>'+c.walk+'</b><span>demanda walking</span></div><div class="metric"><b>'+crmScore(c)+'</b><span>tracción CRM</span></div><div class="metric"><b>'+c.fit+'</b><span>encaje producto</span></div><div class="metric"><b>'+c.momentum+'</b><span>momentum</span></div><div class="metric"><b>'+c.div+'</b><span>diversificación</span></div><div class="metric"><b>'+c.event+'</b><span>catalizador</span></div></div><div class="nextact"><b>Siguiente paso recomendado</b><br>'+nextAction(c)+'</div>';document.getElementById('sheet').classList.add('show');document.getElementById('closeSheet').addEventListener('click',closeSheet);map.flyTo([c.lat,c.lng],Math.max(map.getZoom(),5),{duration:.45})}function closeSheet(){document.getElementById('sheet').classList.remove('show')}function showPlan(){const sorted=[...cities].filter(c=>c.tier!=='WON').sort((a,b)=>b.score-a.score).slice(0,18);document.getElementById('sheetBody').innerHTML='<div class="sheet-head"><div><h3>Plan mundial</h3><div class="status now">Orden recomendado de ataque</div></div><button class="close" id="closeSheet" aria-label="Cerrar">×</button></div><div class="why">Prioriza score, tracción real y equilibrio internacional. El CRM debe prevalecer cuando aparezca evidencia nueva.</div><div class="queue">'+sorted.map((c,i)=>'<div class="qrow"><div class="n">'+(i+1)+'</div><button data-city="'+c.name+'"><div class="city">'+c.name+'</div><div class="sub">'+c.country+' · '+tierLabel(c.tier)+'</div></button><div class="badge">'+c.score+'</div></div>').join('')+'</div><div class="nextact"><b>Algoritmo</b><br>30% demanda walking/free tours · 20% tracción CRM · 20% encaje Touryteller · 15% momentum turístico · 10% diversificación · 5% catalizadores.</div>';document.getElementById('sheet').classList.add('show');document.getElementById('closeSheet').addEventListener('click',closeSheet);document.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>{const c=cities.find(x=>x.name===b.dataset.city);if(c)showCity(c)}))}const f=document.getElementById('filters');[['ALL','Todo'],['WON','Conseguido'],['NOW','Prioridad A'],['NEXT','Prioridad B'],['WATCH','Sembrar']].forEach(([k,l],i)=>{const b=document.createElement('button');b.textContent=l;b.className=i?'':'active';b.addEventListener('click',()=>{active=k;[...f.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');closeSheet();render()});f.appendChild(b)});document.getElementById('world').addEventListener('click',()=>{active='ALL';[...f.children].forEach((x,i)=>x.classList.toggle('active',i===0));closeSheet();render()});document.getElementById('fit').addEventListener('click',render);document.getElementById('queue').addEventListener('click',showPlan);document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2)return;const c=cities.find(x=>x.name.toLowerCase().includes(q)||x.country.toLowerCase().includes(q));if(c)showCity(c)});map.on('click',closeSheet);render();</script></body></html>
