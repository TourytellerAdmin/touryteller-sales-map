<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Touryteller Global Expansion</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}#map{background:#e8edf2}.legend{position:absolute;z-index:1000;left:10px;bottom:14px;background:rgba(255,255,255,.96);padding:8px 10px;border-radius:15px;box-shadow:0 8px 24px rgba(15,23,42,.12);font-size:10px;font-weight:800}.legend span{margin-right:9px;white-space:nowrap}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}.leaflet-tooltip{border:0!important;border-radius:12px!important;box-shadow:0 8px 22px rgba(15,23,42,.16)!important;font-size:10px!important;font-weight:800!important}</style></head><body><div id="map"></div><div class="legend"><span><i class="sw" style="background:#8b5cf6"></i>conseguido</span><span><i class="sw" style="background:#f59e0b"></i>atacar</span><span><i class="sw" style="background:#fb923c"></i>siguiente</span><span><i class="sw" style="background:#94a3b8"></i>sembrar</span></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const COLORS={WON:'#8b5cf6',NOW:'#f59e0b',NEXT:'#fb923c',WATCH:'#94a3b8'};const cities=[['Barcelona','España',41.3851,2.1734,'WON'],['Tokio','Japón',35.6895,139.6917,'WON'],['Medellín','Colombia',6.2442,-75.5812,'WON'],['Roma','Italia',41.9028,12.4964,'NOW'],['Madrid','España',40.4168,-3.7038,'NOW'],['Budapest','Hungría',47.4979,19.0402,'NOW'],['Praga','Chequia',50.0755,14.4378,'NOW'],['Lisboa','Portugal',38.7223,-9.1393,'NOW'],['Ámsterdam','Países Bajos',52.3676,4.9041,'NOW'],['Oporto','Portugal',41.1579,-8.6291,'NOW'],['Londres','Reino Unido',51.5072,-.1276,'NOW'],['Berlín','Alemania',52.52,13.405,'NOW'],['Estambul','Turquía',41.0082,28.9784,'NOW'],['Cracovia','Polonia',50.0647,19.945,'NOW'],['Dublín','Irlanda',53.3498,-6.2603,'NOW'],['Nueva York','Estados Unidos',40.7128,-74.006,'NEXT'],['Ciudad de México','México',19.4326,-99.1332,'NEXT'],['Santiago','Chile',-33.4489,-70.6693,'NEXT'],['Buenos Aires','Argentina',-34.6037,-58.3816,'NEXT'],['Kioto','Japón',35.0116,135.7681,'NEXT'],['Seúl','Corea del Sur',37.5665,126.978,'NEXT'],['Bangkok','Tailandia',13.7563,100.5018,'NEXT'],['Singapur','Singapur',1.3521,103.8198,'WATCH'],['Dubái','Emiratos Árabes Unidos',25.2048,55.2708,'WATCH'],['Marrakech','Marruecos',31.6295,-7.9811,'NEXT'],['Ciudad del Cabo','Sudáfrica',-33.9249,18.4241,'WATCH'],['Sídney','Australia',-33.8688,151.2093,'WATCH'],['Toronto','Canadá',43.6532,-79.3832,'WATCH']].map(x=>({name:x[0],country:x[1],lat:x[2],lng:x[3],tier:x[4]}));const countryTier={};const rank={WATCH:1,NEXT:2,NOW:3,WON:4};cities.forEach(c=>{if(!countryTier[c.country]||rank[c.tier]>rank[countryTier[c.country]])countryTier[c.country]=c.tier});const aliases={'Spain':'España','Japan':'Japón','Colombia':'Colombia','Italy':'Italia','Hungary':'Hungría','Czechia':'Chequia','Czech Republic':'Chequia','Portugal':'Portugal','Netherlands':'Países Bajos','United Kingdom':'Reino Unido','Germany':'Alemania','Türkiye':'Turquía','Turkey':'Turquía','Poland':'Polonia','Ireland':'Irlanda','United States of America':'Estados Unidos','United States':'Estados Unidos','Mexico':'México','Chile':'Chile','Argentina':'Argentina','South Korea':'Corea del Sur','Republic of Korea':'Corea del Sur','Thailand':'Tailandia','Singapore':'Singapur','United Arab Emirates':'Emiratos Árabes Unidos','Morocco':'Marruecos','South Africa':'Sudáfrica','Australia':'Australia','Canada':'Canadá'};const map=L.map('map',{worldCopyJump:true,minZoom:2,zoomSnap:.5}).setView([25,10],2);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:20,opacity:.50}).addTo(map);const countryLayer=L.layerGroup().addTo(map);fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson').then(r=>r.json()).then(data=>{L.geoJSON(data,{style:f=>{const raw=f.properties.name||f.properties.ADMIN||f.properties.ADMIN0_NAME||'';const name=aliases[raw]||raw;const t=countryTier[name];return t?{color:COLORS[t],weight:1.3,opacity:.8,fillColor:COLORS[t],fillOpacity:t==='WON'?.28:t==='NOW'?.20:t==='NEXT'?.14:.09}:{color:'#cbd5e1',weight:.5,opacity:.35,fillColor:'#fff',fillOpacity:0}},onEachFeature:(f,l)=>{const raw=f.properties.name||f.properties.ADMIN||'';const name=aliases[raw]||raw;const t=countryTier[name];if(t)l.bindTooltip('<b>'+name+'</b><br>'+({WON:'Conseguido',NOW:'Prioridad A · atacar',NEXT:'Prioridad B · siguiente',WATCH:'Sembrar / observar'})[t],{sticky:true})}}).addTo(countryLayer)});cities.forEach(c=>{const m=L.circleMarker([c.lat,c.lng],{radius:c.tier==='NOW'?8:c.tier==='WON'?9:6,color:'#fff',weight:2,fillColor:COLORS[c.tier],fillOpacity:.98}).addTo(map);m.bindTooltip('<b>'+c.name+'</b> · '+c.country,{direction:'top'})});</script></body></html>
