<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Touryteller Sales Intelligence</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}body{background:#eef2f7}</style></head><body><iframe id="base" src="https://raw.githack.com/TourytellerAdmin/touryteller-sales-map/main/mobile-v2.html"></iframe><script>const PRIORITY_CITIES=new Set(['Madrid','París','Roma','Londres','Budapest','Dublín','Berlín','Praga','Estambul','Dubrovnik']);const PRIORITY_COUNTRIES=new Set(['Spain','France','Italy','United Kingdom','Hungary','Ireland','Germany','Czech Republic','Turkey','Croatia']);const frame=document.getElementById('base');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=w.document;const style=d.createElement('style');style.textContent=`:root{--priority:#f59e0b}.priority-halo{filter:drop-shadow(0 0 8px rgba(245,158,11,.9))}.status.priority{background:#fef3c7;color:#92400e}.legend{flex-wrap:wrap}.legend .priority-key{display:inline-flex;align-items:center;gap:4px}`;d.head.appendChild(style);const legend=d.querySelector('.legend');if(legend&&!legend.querySelector('.priority-key')){const s=d.createElement('span');s.className='priority-key';s.innerHTML='<i class="sw" style="background:#f59e0b"></i> prioridad 2026';legend.insertBefore(s,legend.lastElementChild)};const addPriorityCountries=()=>{if(!w.L||!w.map)return;fetch('https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries.geo.json').then(r=>r.json()).then(g=>w.L.geoJSON(g,{style:f=>PRIORITY_COUNTRIES.has(f.properties.name)?{color:'#d97706',weight:1.2,fillColor:'#f59e0b',fillOpacity:.22}:{weight:0,fillOpacity:0},onEachFeature:(f,l)=>{if(PRIORITY_COUNTRIES.has(f.properties.name))l.bindTooltip(f.properties.name+' · prioridad 2026')}}).addTo(w.map)).catch(()=>{});};const addPriorityCities=()=>{if(!w.L||!w.map||!w.data)return;for(const city of PRIORITY_CITIES){const x=w.data[city];if(!x)continue;w.L.circleMarker([x.lat,x.lng],{radius:20+Math.sqrt(x.total)*3.5,color:'#f59e0b',weight:4,fillColor:'#f59e0b',fillOpacity:.08,className:'priority-halo'}).bindTooltip(city+' · prioridad 2026',{direction:'top'}).addTo(w.map)}};setTimeout(()=>{addPriorityCountries();addPriorityCities()},700);const originalShow=w.show;if(typeof originalShow==='function'){w.show=function(x){originalShow(x);setTimeout(()=>{const st=d.querySelector('.status');if(st&&PRIORITY_CITIES.has(x.city)&&!st.classList.contains('won')){st.classList.add('priority');st.textContent='Prioridad 2026 · objetivo por conquistar · '+(x.country||'')}} ,0)}};});</script></body></html>
